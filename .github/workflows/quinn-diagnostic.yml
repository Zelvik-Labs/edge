name: Quinn fresh-connection protocol diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: quinn-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore exact original server executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/perf/quinn-diagnostic/restore.py
      - name: Prepare all images before timing
        run: |
          docker pull nginx:1.28.0
          docker pull openresty/openresty:1.27.1.2-0-bookworm-fat
          docker build -t edge-http-state-fixture:20261103 -f scripts/perf/http-state/Dockerfile .
      - name: Diagnose native and shared Quinn with bounded client traces
        run: |
          docker run --rm --name edge-quinn-diagnostic-harness --network host --pid host \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
            -e GITHUB_SHA -e EDGE_MATRIX_HARNESS_NAME=edge-quinn-diagnostic-harness \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            edge-http-state-fixture:20261103 bash scripts/perf/quinn-diagnostic/run-ci.sh
      - name: Recompute every transfer and decode retained error frames
        if: always()
        run: |
          if [ -f .local/quinn-diagnostic-private/suite.json ]; then
            python3 scripts/perf/quinn-diagnostic/verify.py .local/quinn-diagnostic-private .local/quinn-diagnostic-binaries
          fi
      - name: Collect public evidence without runtime secrets
        if: always()
        run: |
          if [ -d .local/quinn-diagnostic-private ]; then
            sudo chown -R "$(id -u):$(id -g)" .local/quinn-diagnostic-private
          fi
          python3 scripts/perf/quinn-diagnostic/collect.py
      - name: Retain all samples, controls and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quinn-diagnostic-${{ github.sha }}
          path: .local/quinn-diagnostic-ci/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain original server and diagnostic client executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quinn-diagnostic-binaries-${{ github.sha }}
          path: |
            .local/quinn-diagnostic-binaries/
            .local/quinn-diagnostic-private/protocol-state-client
          include-hidden-files: true
          if-no-files-found: error
