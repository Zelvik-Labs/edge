name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check / Clippy - linux-x64
    runs-on: [self-hosted, Linux, X64, zelvik-ci]
    timeout-minutes: 45
    env:
      # .cargo/config.toml sets target-cpu=native, but rust-cache restores
      # target/ across heterogeneous runner hardware — a proc-macro .so
      # compiled for a newer CPU SIGILLs inside rustc on an older runner
      # (observed twice compiling pingora-pool). RUSTFLAGS env overrides
      # config.toml; pin the CI baseline to the minimum release target.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
      # cargo 默认用内置 git 后端，**不读** GIT_CONFIG_COUNT/KEY/VALUE 环境变量；
      # 凭据步骤靠 url.*.insteadOf 把 https 改写成 ssh，必须切到 git CLI 后端才生效。
      # 暖缓存命中（rust-cache 里已有 ~/.cargo/git/db）时不会暴露，冷缓存才失败。
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Cargo.toml 经 https git 依赖私有仓 protocol（zelvik-suite）。凭据是**只读 deploy key**
      # （仓库 secret PROTOCOL_DEPLOY_KEY），只对 protocol 有效；不用个人长期 token，
      # 也不在 runner 主机上落任何凭据。把 https URL 改写成 ssh URL 让 git 用这把 key。
      # 托管 runner 上曾靠 rust-cache 里已有的 ~/.cargo/git/db 侥幸跳过 clone，
      # 自托管冷缓存必须真 clone，缺这一步就会在依赖解析阶段失败。
      - name: 私有 protocol 依赖凭据（只读 deploy key）
        run: |
          set -euo pipefail
          if [ -z "${PROTOCOL_DEPLOY_KEY:-}" ]; then
            echo "::error::缺少仓库 secret PROTOCOL_DEPLOY_KEY：protocol 为私有仓库，没有凭据无法拉取依赖。"
            exit 1
          fi

          key="$RUNNER_TEMP/protocol_deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$PROTOCOL_DEPLOY_KEY" > "$key"

          # 主机密钥来自 HTTPS 接口而不是首次连接的 TOFU，避免第一次连接就被固定成伪造密钥。
          curl -fsSL https://api.github.com/meta \
            | grep -oE '"ssh-[a-z0-9-]+ [A-Za-z0-9+/=]+"' \
            | tr -d '"' | sed 's/^/github.com /' > "$RUNNER_TEMP/known_hosts"

          {
            echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.git@github.com:Zelvik-Labs/protocol.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/Zelvik-Labs/protocol"
          } >> "$GITHUB_ENV"
        env:
          PROTOCOL_DEPLOY_KEY: ${{ secrets.PROTOCOL_DEPLOY_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          packages=(cmake build-essential clang pkg-config perl protobuf-compiler libclang-dev libelf-dev zlib1g-dev libzstd-dev libpcap0.8-dev m4 llvm)

          # 自托管 runner 是 Ubuntu 24.04 (noble)，自带发行版源，因此原先为
          # GitHub 托管镜像写的「改写 sources 并钉死 jammy」不再适用：在 noble 上
          # 满足 jammy 的依赖要求把 libc6 从 2.39 降级到 2.35，而 apt-get -y 会直接
          # 拒绝（E: Packages were downgraded ... without --allow-downgrades），
          # 三次重试后 exit 1。改用 runner 自己的源，只保留超时与重试。
          sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            pingora-main -> pingora-main/target

      - name: Install eBPF Toolchain
        shell: bash
        env:
          # Same pin as release.yml — bumping it requires re-running the
          # XDP/AF_XDP smoke matrix.
          BPF_LINKER_VERSION: "0.11.1"
        run: |
          set -euo pipefail
          EBPF_NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/zelvik-edge-xdp-ebpf/rust-toolchain.toml | head -1)"
          test -n "$EBPF_NIGHTLY"
          rustup toolchain install "$EBPF_NIGHTLY" --profile minimal -c rust-src -c rustc-dev
          # bpf-linker links against libLLVM (>= the LLVM providing
          # LLVMGetDINodeTag). Distro LLVM is too old; the toolchain's own
          # rustc-dev component ships the version-exact shared lib, so
          # point LLVM_PREFIX at the sysroot and provide the unversioned
          # soname the linker looks for.
          SYSROOT="$(rustup run "$EBPF_NIGHTLY" rustc --print sysroot)"
          ln -sf "$(find "$SYSROOT/lib" -name 'libLLVM.so.*' -print -quit)" "$SYSROOT/lib/libLLVM.so"
          export LLVM_PREFIX="$SYSROOT"
          cargo +"$EBPF_NIGHTLY" install bpf-linker --version "$BPF_LINKER_VERSION" --locked

      - name: Build XDP eBPF Object
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/zelvik-edge-xdp-ebpf.o
          cargo xtask build-ebpf
          test -s data/zelvik-edge-xdp-ebpf.o
          echo "ZELVIK_EDGE_XDP_EBPF_SOURCE=data/zelvik-edge-xdp-ebpf.o" >> "$GITHUB_ENV"
          echo "ZELVIK_EDGE_XDP_EBPF_SHA256=$(sha256sum data/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: cargo check (all targets)
        run: cargo check --all-targets

      - name: cargo check (vendored pingora crates)
        run: cargo check --manifest-path pingora-main/Cargo.toml -p pingora-core -p pingora-http -p pingora-cache -p pingora-proxy --all-targets

      - name: cargo clippy
        # Deny high-signal lint groups; pre-existing style warnings stay advisory.
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

  test:
    name: Test - linux-x64
    runs-on: [self-hosted, Linux, X64, zelvik-ci]
    timeout-minutes: 60
    env:
      # Same rationale as the check job: target-cpu=native artifacts in the
      # shared rust-cache SIGILL on older runner hardware.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
      # 同 check job：cargo 内置 git 后端不读 GIT_CONFIG_*，凭据步骤的
      # url.*.insteadOf 改写只有在 git CLI 后端下才生效。
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Cargo.toml 经 https git 依赖私有仓 protocol（zelvik-suite）。凭据是**只读 deploy key**
      # （仓库 secret PROTOCOL_DEPLOY_KEY），只对 protocol 有效；不用个人长期 token，
      # 也不在 runner 主机上落任何凭据。把 https URL 改写成 ssh URL 让 git 用这把 key。
      # 托管 runner 上曾靠 rust-cache 里已有的 ~/.cargo/git/db 侥幸跳过 clone，
      # 自托管冷缓存必须真 clone，缺这一步就会在依赖解析阶段失败。
