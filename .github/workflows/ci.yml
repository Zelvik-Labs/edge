name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      splice_benchmark:
        description: Run isolated blocking/readiness splice component comparison
        type: boolean
        default: false
      io_uring_benchmark:
        description: Test io_uring splice against readiness and default io-wq limits at 1 and 16 connections
        type: boolean
        default: false
      xdp_kernel_probe:
        description: Probe BPF load and AF_XDP socket creation inside an isolated network namespace
        type: boolean
        default: false
      xdp_wake_probe:
        description: Exercise real AF_XDP copy-mode RX, readiness, fill recovery, TX and teardown on isolated veths
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  xdp-kernel:
    name: Isolated BPF / AF_XDP capability
    if: github.event_name == 'workflow_dispatch' && (inputs.xdp_kernel_probe || inputs.xdp_wake_probe)
    # The standalone ring fixture uses libbpf >= 1.0 APIs; noble ships 1.3.
    # Rust correctness and timed splice comparisons keep their 22.04 baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Compile and probe without attaching interfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/xdp-kernel-ci
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          source = pathlib.Path('scripts/perf/kernel-capability.c')
          metadata = {'commit': os.environ['GITHUB_SHA'], 'kernel': platform.uname()._asdict(), 'cpus': sorted(os.sched_getaffinity(0)), 'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'compiler': subprocess.check_output(['cc', '--version'], text=True).splitlines()[0], 'scope': 'minimal XDP_PASS load/close and AF_XDP socket open/close; no attachment or traffic'}
          pathlib.Path('.local/xdp-kernel-ci/metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          cc -std=gnu11 -O2 -Wall -Wextra -Werror scripts/perf/kernel-capability.c -o .local/xdp-kernel-ci/probe > .local/xdp-kernel-ci/build.log 2>&1
          sudo unshare --net -- .local/xdp-kernel-ci/probe > .local/xdp-kernel-ci/result.json 2> .local/xdp-kernel-ci/probe.log
          cat .local/xdp-kernel-ci/result.json
      - name: Install real AF_XDP probe dependencies
        if: inputs.xdp_wake_probe
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libxdp-dev libbpf-dev pkg-config
      - name: Build and exercise real copy-mode AF_XDP rings
        if: inputs.xdp_wake_probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          files = ['scripts/perf/afxdp-wake.c', 'scripts/perf/afxdp-wake.sh']
          metadata = {'sources': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}, 'library_versions': subprocess.check_output(['pkg-config', '--modversion', 'libxdp', 'libbpf'], text=True).splitlines(), 'scope': 'veth SKB / forced copy mode; no hardware zero-copy or Tokio throughput claim'}
          pathlib.Path('.local/xdp-kernel-ci/wake-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          read -ra native_flags <<< "$(pkg-config --cflags --libs libxdp libbpf)"
          pkg-config --atleast-version=1.0 libbpf
          cc -std=gnu11 -O2 -Wall -Wextra -Werror scripts/perf/afxdp-wake.c -o .local/xdp-kernel-ci/wake-probe "${native_flags[@]}" > .local/xdp-kernel-ci/wake-build.log 2>&1
          parent_net=$(readlink /proc/self/ns/net)
          sudo unshare --net -- bash scripts/perf/afxdp-wake.sh "$GITHUB_WORKSPACE/.local/xdp-kernel-ci/wake-probe" "$GITHUB_WORKSPACE/.local/xdp-kernel-ci" "$parent_net"
      - name: Upload kernel capability and failures
        if: always() && hashFiles('.local/xdp-kernel-ci/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xdp-kernel-${{ github.sha }}
          path: |
            .local/xdp-kernel-ci/*.json
            .local/xdp-kernel-ci/*.log
          if-no-files-found: error

  check:
    name: Check / Clippy - linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # .cargo/config.toml sets target-cpu=native, but rust-cache restores
      # target/ across heterogeneous runner hardware — a proc-macro .so
      # compiled for a newer CPU SIGILLs inside rustc on an older runner
      # (observed twice compiling pingora-pool). RUSTFLAGS env overrides
      # config.toml; pin the CI baseline to the minimum release target.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
      # cargo 默认用内置 git 后端，**不读** GIT_CONFIG_COUNT/KEY/VALUE 环境变量；
      # 凭据步骤靠 url.*.insteadOf 把 https 改写成 ssh，必须切到 git CLI 后端才生效。
      # 暖缓存命中（rust-cache 里已有 ~/.cargo/git/db）时不会暴露，冷缓存才失败。
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout geo runtime dependency
        uses: actions/checkout@v5
        with:
          repository: Zelvik-Labs/dns
          ref: aca0f3bb61bc498682b10900b4886709a2c248b8
          ssh-key: ${{ secrets.ZELVIK_DNS_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/dns

      - name: Link sibling geo runtime path
        run: ln -s "$GITHUB_WORKSPACE/.ci/dns" "$GITHUB_WORKSPACE/../dns"

      # Cargo.toml 经 https git 依赖私有仓 protocol（zelvik-suite）。凭据是**只读 deploy key**
      # （仓库 secret PROTOCOL_DEPLOY_KEY），只对 protocol 有效；不用个人长期 token，
      # 也不在 runner 主机上落任何凭据。把 https URL 改写成 ssh URL 让 git 用这把 key。
      # 托管 runner 上曾靠 rust-cache 里已有的 ~/.cargo/git/db 侥幸跳过 clone，
      # 自托管冷缓存必须真 clone，缺这一步就会在依赖解析阶段失败。
      - name: 私有 protocol 依赖凭据（只读 deploy key）
        run: |
          set -euo pipefail
          if [ -z "${PROTOCOL_DEPLOY_KEY:-}" ]; then
            echo "::error::缺少仓库 secret PROTOCOL_DEPLOY_KEY：protocol 为私有仓库，没有凭据无法拉取依赖。"
            exit 1
          fi

          key="$RUNNER_TEMP/protocol_deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$PROTOCOL_DEPLOY_KEY" > "$key"

          # 主机密钥来自 HTTPS 接口而不是首次连接的 TOFU，避免第一次连接就被固定成伪造密钥。
          if ! curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 2 \
            -D "$RUNNER_TEMP/github-meta.headers" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CI_METADATA_TOKEN" \
            https://api.github.com/meta > "$RUNNER_TEMP/github-meta.json"; then
            python3 - <<'PYMETAERROR'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          headers = root / 'github-meta.headers'
          if headers.exists():
              for line in headers.read_text().splitlines():
                  if line.lower().startswith(('http/', 'x-ratelimit-')):
                      print(line)
          try:
              message = json.loads((root / 'github-meta.json').read_text()).get('message', 'no API message')
          except json.JSONDecodeError:
              message = 'metadata endpoint returned a non-JSON error'
          print(f'::error::GitHub metadata API failed: {message}')
          PYMETAERROR
            exit 1
          fi
          python3 - <<'PYMETA'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          keys = json.loads((root / 'github-meta.json').read_text())['ssh_keys']
          assert isinstance(keys, list) and keys and all(isinstance(key, str) and key for key in keys)
          (root / 'known_hosts').write_text(''.join(f'github.com {key}\n' for key in keys))
          PYMETA

          {
            echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.git@github.com:Zelvik-Labs/protocol.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/Zelvik-Labs/protocol"
          } >> "$GITHUB_ENV"
        env:
          PROTOCOL_DEPLOY_KEY: ${{ secrets.PROTOCOL_DEPLOY_KEY }}
          CI_METADATA_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          packages=(cmake build-essential clang pkg-config perl protobuf-compiler libclang-dev libelf-dev zlib1g-dev libzstd-dev libpcap0.8-dev m4 llvm)

          # 自托管 runner 是 Ubuntu 24.04 (noble)，自带发行版源，因此原先为
          # GitHub 托管镜像写的「改写 sources 并钉死 jammy」不再适用：在 noble 上
          # 满足 jammy 的依赖要求把 libc6 从 2.39 降级到 2.35，而 apt-get -y 会直接
          # 拒绝（E: Packages were downgraded ... without --allow-downgrades），
          # 三次重试后 exit 1。改用 runner 自己的源，只保留超时与重试。
          sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            pingora-main -> pingora-main/target

      - name: Install eBPF Toolchain
        shell: bash
        env:
          # Same pin as release.yml — bumping it requires re-running the
          # XDP/AF_XDP smoke matrix.
          BPF_LINKER_VERSION: "0.11.1"
        run: |
          set -euo pipefail
          EBPF_NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/zelvik-edge-xdp-ebpf/rust-toolchain.toml | head -1)"
          test -n "$EBPF_NIGHTLY"
          rustup toolchain install "$EBPF_NIGHTLY" --profile minimal -c rust-src -c rustc-dev
          # bpf-linker links against libLLVM (>= the LLVM providing
          # LLVMGetDINodeTag). Distro LLVM is too old; the toolchain's own
          # rustc-dev component ships the version-exact shared lib, so
          # point LLVM_PREFIX at the sysroot and provide the unversioned
          # soname the linker looks for.
          SYSROOT="$(rustup run "$EBPF_NIGHTLY" rustc --print sysroot)"
          ln -sf "$(find "$SYSROOT/lib" -name 'libLLVM.so.*' -print -quit)" "$SYSROOT/lib/libLLVM.so"
          export LLVM_PREFIX="$SYSROOT"
          cargo +"$EBPF_NIGHTLY" install bpf-linker --version "$BPF_LINKER_VERSION" --locked

      - name: Build XDP eBPF Object
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/zelvik-edge-xdp-ebpf.o
          cargo xtask build-ebpf
          test -s data/zelvik-edge-xdp-ebpf.o
          echo "ZELVIK_EDGE_XDP_EBPF_SOURCE=data/zelvik-edge-xdp-ebpf.o" >> "$GITHUB_ENV"
          echo "ZELVIK_EDGE_XDP_EBPF_SHA256=$(sha256sum data/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: cargo check (all targets)
        run: cargo check --all-targets

      - name: cargo check (vendored pingora crates)
        # --locked: this workspace now commits pingora-main/Cargo.lock so the
        # vendored checks run against the dependency graph the edge binary
        # ships. A stale lock is a build change and must fail here instead of
        # silently re-resolving crates.io that day.
        run: cargo check --locked --manifest-path pingora-main/Cargo.toml -p pingora-core -p pingora-http -p pingora-cache -p pingora-proxy --all-targets

      - name: cargo clippy
        # Deny high-signal lint groups; pre-existing style warnings stay advisory.
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

  test:
    name: Test - linux-x64
    runs-on: ubuntu-22.04
    # 60 分钟不够：`CARGO_BUILD_JOBS=2` 把并行度减半，构建时间随之上去。
    # 原来的 60 分钟里大部分时间也不是在编译，而是在内存上限附近颠簸（见下）。
    timeout-minutes: 90
    env:
      # Same rationale as the check job: target-cpu=native artifacts in the
      # shared rust-cache SIGILL on older runner hardware.
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
      # 同 check job：cargo 内置 git 后端不读 GIT_CONFIG_*，凭据步骤的
      # url.*.insteadOf 改写只有在 git CLI 后端下才生效。
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # 主池 runner Pod 的 limits.memory 是 6Gi，而 cargo 按可见 CPU 默认开 4 个
      # 并行 rustc，单个 rustc 的 anon-rss 实测就有 3.0GiB —— 峰值把 cgroup 顶爆，
      # 内核 OOM killer 挑中的是 Runner.Listener 本身，于是作业不是「失败」而是
      # 「runner 失联」，连失败原因都留不下来。
      # 限到 2 个并发：不改产物、不降可调试性，只是构建慢一些。
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout geo runtime dependency
        uses: actions/checkout@v5
        with:
          repository: Zelvik-Labs/dns
          ref: aca0f3bb61bc498682b10900b4886709a2c248b8
          ssh-key: ${{ secrets.ZELVIK_DNS_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/dns

      - name: Link sibling geo runtime path
        run: ln -s "$GITHUB_WORKSPACE/.ci/dns" "$GITHUB_WORKSPACE/../dns"

      # Cargo.toml 经 https git 依赖私有仓 protocol（zelvik-suite）。凭据是**只读 deploy key**
      # （仓库 secret PROTOCOL_DEPLOY_KEY），只对 protocol 有效；不用个人长期 token，
      # 也不在 runner 主机上落任何凭据。把 https URL 改写成 ssh URL 让 git 用这把 key。
      # 托管 runner 上曾靠 rust-cache 里已有的 ~/.cargo/git/db 侥幸跳过 clone，
      # 自托管冷缓存必须真 clone，缺这一步就会在依赖解析阶段失败。
      - name: 私有 protocol 依赖凭据（只读 deploy key）
        run: |
          set -euo pipefail
          if [ -z "${PROTOCOL_DEPLOY_KEY:-}" ]; then
            echo "::error::缺少仓库 secret PROTOCOL_DEPLOY_KEY：protocol 为私有仓库，没有凭据无法拉取依赖。"
            exit 1
          fi

          key="$RUNNER_TEMP/protocol_deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$PROTOCOL_DEPLOY_KEY" > "$key"

          # 主机密钥来自 HTTPS 接口而不是首次连接的 TOFU，避免第一次连接就被固定成伪造密钥。
          if ! curl --fail-with-body --silent --show-error --location --retry 3 --retry-delay 2 \
            -D "$RUNNER_TEMP/github-meta.headers" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CI_METADATA_TOKEN" \
            https://api.github.com/meta > "$RUNNER_TEMP/github-meta.json"; then
            python3 - <<'PYMETAERROR'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          headers = root / 'github-meta.headers'
          if headers.exists():
              for line in headers.read_text().splitlines():
                  if line.lower().startswith(('http/', 'x-ratelimit-')):
                      print(line)
          try:
              message = json.loads((root / 'github-meta.json').read_text()).get('message', 'no API message')
          except json.JSONDecodeError:
              message = 'metadata endpoint returned a non-JSON error'
          print(f'::error::GitHub metadata API failed: {message}')
          PYMETAERROR
            exit 1
          fi
          python3 - <<'PYMETA'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          keys = json.loads((root / 'github-meta.json').read_text())['ssh_keys']
          assert isinstance(keys, list) and keys and all(isinstance(key, str) and key for key in keys)
          (root / 'known_hosts').write_text(''.join(f'github.com {key}\n' for key in keys))
          PYMETA

          {
            echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.git@github.com:Zelvik-Labs/protocol.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/Zelvik-Labs/protocol"
          } >> "$GITHUB_ENV"
        env:
          PROTOCOL_DEPLOY_KEY: ${{ secrets.PROTOCOL_DEPLOY_KEY }}
          CI_METADATA_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          packages=(cmake build-essential clang pkg-config perl protobuf-compiler libclang-dev libelf-dev zlib1g-dev libzstd-dev libpcap0.8-dev m4 llvm)

          sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            pingora-main -> pingora-main/target

      - name: Install eBPF Toolchain
        shell: bash
        env:
          # Same pin as release.yml — bumping it requires re-running the
          # XDP/AF_XDP smoke matrix.
          BPF_LINKER_VERSION: "0.11.1"
        run: |
          set -euo pipefail
          EBPF_NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/zelvik-edge-xdp-ebpf/rust-toolchain.toml | head -1)"
          test -n "$EBPF_NIGHTLY"
          rustup toolchain install "$EBPF_NIGHTLY" --profile minimal -c rust-src -c rustc-dev
          # bpf-linker links against libLLVM (>= the LLVM providing
          # LLVMGetDINodeTag). Distro LLVM is too old; the toolchain's own
          # rustc-dev component ships the version-exact shared lib, so
          # point LLVM_PREFIX at the sysroot and provide the unversioned
          # soname the linker looks for.
          SYSROOT="$(rustup run "$EBPF_NIGHTLY" rustc --print sysroot)"
          ln -sf "$(find "$SYSROOT/lib" -name 'libLLVM.so.*' -print -quit)" "$SYSROOT/lib/libLLVM.so"
          export LLVM_PREFIX="$SYSROOT"
          cargo +"$EBPF_NIGHTLY" install bpf-linker --version "$BPF_LINKER_VERSION" --locked

      - name: Build XDP eBPF Object
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/zelvik-edge-xdp-ebpf.o
          cargo xtask build-ebpf
          test -s data/zelvik-edge-xdp-ebpf.o
          echo "ZELVIK_EDGE_XDP_EBPF_SOURCE=data/zelvik-edge-xdp-ebpf.o" >> "$GITHUB_ENV"
          echo "ZELVIK_EDGE_XDP_EBPF_SHA256=$(sha256sum data/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: cargo test
        run: cargo test --lib --bins

      - name: cargo test (integration)
        run: cargo test --no-fail-fast --test '*'

      - name: cargo test (vendored pingora)
        # --locked: see the vendored check step; without it cargo re-resolves
        # the whole workspace and tests tokio versions the product never ships.
        run: cargo test --locked --manifest-path pingora-main/Cargo.toml -p pingora-core -p pingora-http -p pingora-cache --lib

      - name: io_uring behavior tests and Clippy
        if: github.event_name == 'workflow_dispatch' && inputs.io_uring_benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/splice-ci
          cargo test --locked -p zelvik-edge-io --features io-uring > .local/splice-ci/uring-tests.log 2>&1
          cargo clippy --locked -p zelvik-edge-io --features io-uring --all-targets -- -D clippy::correctness -D clippy::suspicious > .local/splice-ci/uring-clippy.log 2>&1

      - name: Build splice component benchmark
        if: github.event_name == 'workflow_dispatch' && (inputs.splice_benchmark || inputs.io_uring_benchmark)
        shell: bash
        env:
          IO_URING_BENCHMARK: ${{ inputs.io_uring_benchmark }}
        run: |
          set -euo pipefail
          mkdir -p .local/splice-ci
          features=()
          if [ "$IO_URING_BENCHMARK" = "true" ]; then
            features=(--features io-uring)
          fi
          cargo build --locked --release -p zelvik-edge-io --bench splice "${features[@]}" --message-format=json > .local/splice-ci/build.jsonl 2> .local/splice-ci/build.stderr
          python3 - <<'PY'
          import json, pathlib, os
          records = [json.loads(line) for line in pathlib.Path('.local/splice-ci/build.jsonl').read_text().splitlines() if line.startswith('{')]
          binaries = [r['executable'] for r in records if r.get('reason') == 'compiler-artifact' and r['target']['name'] == 'splice' and 'bench' in r['target']['kind'] and r.get('executable')]
          assert len(binaries) == 1, binaries
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'EDGE_SPLICE_BENCH_BINARY={binaries[0]}\n')
          PY

      - name: Compare splice engines after all compilation finishes
        if: github.event_name == 'workflow_dispatch' && (inputs.splice_benchmark || inputs.io_uring_benchmark)
        shell: bash
        env:
          IO_URING_BENCHMARK: ${{ inputs.io_uring_benchmark }}
        run: |
          set -euo pipefail
          if [ "$IO_URING_BENCHMARK" = "true" ]; then
            python3 scripts/perf/compare-splice.py --binary "$EDGE_SPLICE_BENCH_BINARY" --baseline-engine readiness --candidate-engine uring --concurrency 1 --output .local/splice-ci/comparison-c1
            python3 scripts/perf/compare-splice.py --binary "$EDGE_SPLICE_BENCH_BINARY" --baseline-engine readiness --candidate-engine uring --concurrency 16 --output .local/splice-ci/comparison-c16
            python3 scripts/perf/compare-splice.py --binary "$EDGE_SPLICE_BENCH_BINARY" --baseline-engine uring-unbounded --candidate-engine uring --concurrency 1 --output .local/splice-ci/workers-c1
            python3 scripts/perf/compare-splice.py --binary "$EDGE_SPLICE_BENCH_BINARY" --baseline-engine uring-unbounded --candidate-engine uring --concurrency 16 --output .local/splice-ci/workers-c16
          else
            python3 scripts/perf/compare-splice.py --binary "$EDGE_SPLICE_BENCH_BINARY" --output .local/splice-ci/comparison
          fi

      - name: Upload splice samples and failures
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.splice_benchmark || inputs.io_uring_benchmark) && hashFiles('.local/splice-ci/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: splice-component-${{ github.sha }}
          path: .local/splice-ci/
          if-no-files-found: error
