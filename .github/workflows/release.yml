name: Release

# Stable tags publish automatically. A manual dispatch may rebuild an immutable
# tag from the fixed workflow on main (source_ref) and publish only when the
# publish input is true. Beta/rc tags are rejected before any portal write.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable tag to build, e.g. v26.10.3.1 (empty = dispatched commit; publishing requires a tag)"
        required: false
        default: ""
      publish:
        description: "Upload packages to license.zelvik.net and promote the stable channel"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolve the one source commit this run may publish. The workflow/scripts
  # come from the dispatched revision (main for a retry); the product source
  # comes from the immutable tag. A tag is never moved and a branch commit is
  # never presented as a release commit.
  prepare:
    name: Resolve immutable source
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    env:
      PORTAL_URL: ${{ vars.ZELVIK_PORTAL_URL || 'https://license.zelvik.net' }}
      PORTAL_ADMIN_USER: ${{ secrets.ZELVIK_PORTAL_ADMIN_USER }}
      PORTAL_ADMIN_PASSWORD: ${{ secrets.ZELVIK_PORTAL_ADMIN_PASSWORD }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v5
        with:
          path: pipeline
          fetch-depth: 1

      - name: Checkout source ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: source
          fetch-depth: 0

      - name: Resolve tag, version and source commit
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd source
          PUBLISH=false
          RELEASE_ID=""
          TAG=""
          COMMIT="$(git rev-parse HEAD)"
          if [ "${EVENT_NAME}" = "push" ]; then
            TAG="${PUSH_TAG}"
            PUBLISH=true
          else
            if [ "${DISPATCH_PUBLISH:-false}" = "true" ]; then
              PUBLISH=true
            fi
            if [ -n "${DISPATCH_SOURCE_REF}" ]; then
              TAG="${DISPATCH_SOURCE_REF#refs/tags/}"
            fi
          fi
          if [ "${PUBLISH}" = "true" ]; then
            [ -n "${TAG}" ] || { echo "::error::publish=true requires source_ref to be an immutable tag" >&2; exit 1; }
            case "${TAG}" in
              v*) ;;
              *) echo "::error::source_ref ${TAG} is not a v* release tag" >&2; exit 1 ;;
            esac
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" || {
              echo "::error::source_ref ${TAG} is not a tag in the source checkout" >&2; exit 1;
            }
            [ "${TAG_COMMIT}" = "${COMMIT}" ] || {
              echo "::error::tag ${TAG} points at ${TAG_COMMIT}, but checkout is ${COMMIT}" >&2; exit 1;
            }
            VERSION="$(bash scripts/release-version.sh --print)"
            python3 "${GITHUB_WORKSPACE}/pipeline/scripts/portal-publish.py" prepare               --tag "${TAG}" --source-commit "${COMMIT}" --version "${VERSION}"
            RELEASE_ID="$(sed -n 's/^release_id=//p' "${GITHUB_OUTPUT}" | tail -1)"
          else
            VERSION="$(bash scripts/release-version.sh --print)"
            echo "::notice::validation-only dispatch: no portal upload or promotion"
          fi
          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
          echo "source=${COMMIT} tag=${TAG} version=${VERSION} publish=${PUBLISH}"

  # One eBPF build for the whole release. Every leg downloads the exact bytes
  # whose SHA256 was verified here, so build.rs embeds the packaged object and
  # holds it to the same digest (ZELVIK_EDGE_XDP_EBPF_SHA256).
  ebpf:
    name: Build eBPF object (shared)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      publish: ${{ needs.prepare.outputs.publish }}
      version: ${{ needs.prepare.outputs.version }}
      source_commit: ${{ needs.prepare.outputs.source_commit }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Build XDP eBPF Object
        shell: bash
        env:
          # bpf-linker is pinned to the combination verified in validation;
          # bumping it requires re-running the XDP/AF_XDP smoke matrix.
          BPF_LINKER_VERSION: "0.11.1"
        run: |
          set -euo pipefail
          # The dated nightly lives in one place only: the eBPF crate's
          # rust-toolchain.toml. xtask build-ebpf and build.rs resolve the same
          # channel, so the toolchain installed here is provably the one used.
          EBPF_NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/zelvik-edge-xdp-ebpf/rust-toolchain.toml | head -1)"
          test -n "$EBPF_NIGHTLY"
          rustup toolchain install "$EBPF_NIGHTLY" --profile minimal -c rust-src -c rustc-dev
          rustup run "$EBPF_NIGHTLY" rustc --version
          SYSROOT="$(rustup run "$EBPF_NIGHTLY" rustc --print sysroot)"
          ln -sf "$(find "$SYSROOT/lib" -name 'libLLVM.so.*' -print -quit)" "$SYSROOT/lib/libLLVM.so"
          LLVM_PREFIX="$SYSROOT" cargo +"$EBPF_NIGHTLY" install bpf-linker --version "$BPF_LINKER_VERSION" --locked
          bpf-linker --version
          rm -f data/zelvik-edge-xdp-ebpf.o
          cargo xtask build-ebpf
          test -s data/zelvik-edge-xdp-ebpf.o
          mkdir -p ebpf-out
          cp data/zelvik-edge-xdp-ebpf.o ebpf-out/zelvik-edge-xdp-ebpf.o
          sha256sum ebpf-out/zelvik-edge-xdp-ebpf.o | awk '{print $1}' > ebpf-out/sha256.txt
          cat ebpf-out/sha256.txt

      - name: Upload shared eBPF object
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-object
          path: ebpf-out
          if-no-files-found: error
          retention-days: 3

  # Five matrix legs run in parallel, one runner each: no leg waits on another
  # leg's cache, target directory or toolchain.
  build:
    name: Build - ${{ matrix.name }}
    needs: ebpf
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Job-level so every step (build, ELF check, smoke run, package) sees the
    # same directory under set -u; a step-local env would be unbound later.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/${{ matrix.name }}
      PIPELINE_DIR: ${{ github.workspace }}/.ci-pipeline
      # Fetch private git dependencies through the git CLI. cargo's libgit2
      # backend ignores the ~/.ssh/config host aliases that pin one deploy key
      # per repository, which is why the protocol dependency authenticated as the
      # wrong key and failed with "Repository not found"; the CLI honours them.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Five independent legs, one runner each. Asset names are the正式
          # release names the bootstrap and license site already expect; a
          # patch release must not rename them. The version travels in the
          # release directory, the package metadata, the packaged VERSION file
          # and the binary itself.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cpu: x86-64-v2
            name: linux-x64-v2-sse4.2
            cache_key: x64-v2-pclmul
            rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
            cpu_features: "+pclmulqdq"
            required_cpu_flags: "pclmulqdq,sse4_2"
            readelf: readelf
            elf_machine: "Advanced Micro Devices X86-64"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cpu: x86-64-v3
            name: linux-x64-v3-avx2
            cache_key: x64-v3-avx2
            rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
            cpu_features: "+pclmulqdq"
            required_cpu_flags: "avx2,bmi2,fma"
            readelf: readelf
            elf_machine: "Advanced Micro Devices X86-64"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cpu: x86-64-v4
            name: linux-x64-v4-avx512
            cache_key: x64-v4-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
            cpu_features: "+pclmulqdq"
            required_cpu_flags: "avx512f,avx512bw,avx512vl,avx512dq"
            readelf: readelf
            elf_machine: "Advanced Micro Devices X86-64"
          # --- ARM64 Variants ---
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cpu: generic
            name: linux-arm64-generic
            cache_key: arm64-generic-crypto
            rustflags: "-C target-feature=+neon,+aes,+sha2,+crc"
            cxxflags: ""
            cpu_features: "+neon,+aes,+sha2,+crc"
            required_cpu_flags: "asimd,aes,sha2,crc32"
            readelf: readelf
            elf_machine: AArch64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cpu: neoverse-n1
            name: linux-arm64-neoverse-n1
            cache_key: arm64-n1
            rustflags: "-C target-cpu=neoverse-n1"
            cxxflags: ""
            cpu_features: "+neon,+aes,+sha2,+crc"
            required_cpu_flags: "asimd,aes,sha2,crc32"
            readelf: readelf
            elf_machine: AArch64

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.ebpf.outputs.source_commit }}
          fetch-depth: 1

      # The publishing tool belongs to the workflow revision (main for a retry),
      # not to the immutable product tag: that is how a fixed publish path can
      # retry the same tag without moving it or rebuilding a different commit.
      - name: Checkout pipeline scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .ci-pipeline
          fetch-depth: 1

      # The product version is never written in this workflow: it is resolved
      # from VERSION-MANIFEST.toml and exported to every later step, so the CLI
      # --version, the registration report, install.sh and the package name all
      # come from one value.
      - name: Resolve and check product version
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-version-consistency.sh
          bash scripts/test-release-packaging.sh
          VERSION="$(bash scripts/release-version.sh --print)"
          echo "ZELVIK_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "product version: $VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Normalize Rust Toolchains
        shell: bash
        env:
          RELEASE_RUST_VERSION: "1.99.0"
        run: |
          set -euo pipefail

          rustup default "$RELEASE_RUST_VERSION"
          rustup target add "${{ matrix.target }}" --toolchain "$RELEASE_RUST_VERSION"

          while IFS= read -r line; do
            toolchain="${line%% *}"
            if [ -z "$toolchain" ]; then
              continue
            fi

            case "$toolchain" in
              "$RELEASE_RUST_VERSION"|"$RELEASE_RUST_VERSION"-*)
                ;;
              *)
                rustup toolchain uninstall "$toolchain" || true
                ;;
            esac
          done < <(rustup toolchain list --quiet)

          rustup toolchain list --quiet

      - name: Install dependencies & Cross-Linkers
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # Native arm64 runners need neither amd64 mirror pinning nor x86 cross
          # toolchains: install the native packages and stop here.
          if [ "$(uname -m)" != "x86_64" ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends cmake build-essential protobuf-compiler pkg-config libelf-dev zlib1g-dev libpcap0.8-dev
            exit 0
          fi

          packages=(cmake build-essential golang-go protobuf-compiler pkg-config libelf-dev zlib1g-dev libpcap0.8-dev)

          # GitHub ubuntu-22.04 runners pin apt to azure.archive.ubuntu.com via
          # Mirrorlist. When that host stalls, apt-get update hangs until the
          # job timeout. Pin archive.ubuntu.com (and ports for arm64) instead.
          sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          sudo mkdir -p /etc/apt/sources.list.d.disabled
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.d.disabled/sources.list 2>/dev/null || true
          sudo mv /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d.disabled/apt-mirrors.txt 2>/dev/null || true
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -e "$source" ] || continue
            sudo mv "$source" /etc/apt/sources.list.d.disabled/
          done
          sudo tee /etc/apt/sources.list.d/ubuntu-amd64.list >/dev/null <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF

          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ] && [ "$(uname -m)" = "x86_64" ]; then
            sudo dpkg --add-architecture arm64
            sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
            packages+=(gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libelf-dev:arm64 zlib1g-dev:arm64 libpcap0.8-dev:arm64)
          fi
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

      # The eBPF object is built exactly once (job "ebpf") and reused by every
      # leg. build.rs holds the embedded object to the recorded SHA256, so a
      # missing or substituted artifact fails the build instead of embedding a
      # stale object.
      - name: Download shared eBPF object
        uses: actions/download-artifact@v4
        with:
          name: ebpf-object
          path: ebpf-out

      - name: Verify shared eBPF object
        shell: bash
        run: |
          set -euo pipefail
          test -s ebpf-out/zelvik-edge-xdp-ebpf.o
          test -s ebpf-out/sha256.txt
          test "$(sha256sum ebpf-out/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" = "$(cat ebpf-out/sha256.txt)"
          echo "shared eBPF sha256: $(cat ebpf-out/sha256.txt)"

      # zelvik-geo-runtime lives in the private dns repo and is referenced as
      # ../dns/crates/zelvik-geo-runtime; zelvik-suite is a private cargo git
      # dependency. An open-source repo must still build from a clean checkout,
      # so CI materialises the sibling path and authenticates the git
      # dependency; without the secrets the step fails loudly instead of
      # producing a package that cannot be reproduced.
      #
      # One key per repository, pinned by an SSH host alias (IdentitiesOnly) plus
      # a URL rewrite. A shared ssh-agent is the wrong shape here: GitHub accepts
      # whichever valid deploy key it is offered first, and a key registered for
      # another repository then authenticates without access to this one —
      # run 39603222428 failed exactly that way ("Repository not found" with both
      # keys in one agent), so cargo must never be able to offer the dns key for
      # the protocol repository.
      - name: Checkout private dependencies (dns, protocol)
        shell: bash
        env:
          DNS_DEPLOY_KEY: ${{ secrets.ZELVIK_DNS_DEPLOY_KEY }}
          PROTOCOL_DEPLOY_KEY: ${{ secrets.PROTOCOL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DNS_DEPLOY_KEY" ]; then
            echo "::error::ZELVIK_DNS_DEPLOY_KEY is not configured; zelvik-geo-runtime cannot be resolved" >&2
            exit 1
          fi
          if [ -z "$PROTOCOL_DEPLOY_KEY" ]; then
            echo "::error::PROTOCOL_DEPLOY_KEY is not configured; zelvik-suite git dependency cannot be fetched" >&2
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf "%s\n" "$DNS_DEPLOY_KEY" > ~/.ssh/id_ed25519_dns
          printf "%s\n" "$PROTOCOL_DEPLOY_KEY" > ~/.ssh/id_ed25519_protocol
          chmod 0600 ~/.ssh/id_ed25519_dns ~/.ssh/id_ed25519_protocol
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'SSH_CONFIG'
          Host zelvik-dns
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_dns
            IdentitiesOnly yes

          Host zelvik-protocol
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_protocol
            IdentitiesOnly yes
          SSH_CONFIG
          chmod 0600 ~/.ssh/config
          # Cargo resolves zelvik-suite from https://github.com/Zelvik-Labs/protocol;
          # rewrite that URL to the alias whose only identity is the protocol key.
          git config --global --add url."git@zelvik-protocol:Zelvik-Labs/protocol".insteadOf "https://github.com/Zelvik-Labs/protocol"
          git config --global --add url."git@zelvik-protocol:Zelvik-Labs/protocol".insteadOf "git@github.com:Zelvik-Labs/protocol"
          # Both keys must reach their own repository before a build depends on them.
          git ls-remote git@zelvik-dns:Zelvik-Labs/dns.git HEAD > /dev/null
          git ls-remote git@zelvik-protocol:Zelvik-Labs/protocol.git HEAD > /dev/null
          rm -rf "$GITHUB_WORKSPACE/../dns"
          git clone --depth 1 git@zelvik-dns:Zelvik-Labs/dns.git "$GITHUB_WORKSPACE/../dns"

      - name: Cargo dependency source cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
          key: release-cargo-sources-v1-${{ matrix.cache_key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-cargo-sources-v1-${{ matrix.cache_key }}-

      # Independent target directory per leg: no leg can poison another leg's
      # incremental state, and the key pins target + CPU flags + toolchain +
      # lockfile so a stale cache can never satisfy a different ISA build.
      - name: Target cache (per leg)
        uses: actions/cache@v4
        with:
          path: target/${{ matrix.name }}
          key: release-target-v1-${{ matrix.cache_key }}-${{ matrix.target }}-rust1.99.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-target-v1-${{ matrix.cache_key }}-${{ matrix.target }}-rust1.99.0-



      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          CFLAGS: ${{ matrix.cxxflags }}
          ZELVIK_EDGE_XDP_EBPF_SOURCE: ebpf-out/zelvik-edge-xdp-ebpf.o
          ZELVIK_RELEASE_VERSION: ${{ env.ZELVIK_RELEASE_VERSION }}
        run: |
          set -euo pipefail
          export ZELVIK_EDGE_XDP_EBPF_SHA256="$(cat ebpf-out/sha256.txt)"
          # Use native tools on the arm64 runners. The prefixed cross compiler
          # is installed only when building ARM on an x86_64 host.
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            tool_prefix=""
            if [ "$(uname -m)" != "aarch64" ]; then
              tool_prefix="aarch64-linux-gnu-"
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
            fi
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${tool_prefix}gcc"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR="${tool_prefix}ar"
            export CC="${tool_prefix}gcc"
            export CXX="${tool_prefix}g++"
            export LD="${tool_prefix}ld"
            export AR="${tool_prefix}ar"
            export OBJCOPY="${tool_prefix}objcopy"
            export READELF="${tool_prefix}readelf"
            export CC_aarch64_unknown_linux_gnu="$CC"
            export CXX_aarch64_unknown_linux_gnu="$CXX"
            export AR_aarch64_unknown_linux_gnu="$AR"
            for tool in "$CC" "$CXX" "$LD" "$AR" "$OBJCOPY" "$READELF"; do
              command -v "$tool"
            done
          fi

          cargo build --release --target ${{ matrix.target }} --bin Zelvik-Edge

      # Compiler CPU flags do not guarantee that a specific opcode appears in
      # the final binary (dead code, inlining, LTO), so we do not assert
      # opcodes. What must hold is the architecture the package claims: the ELF
      # machine is checked here, and the CPU baseline / target features /
      # toolchain that actually produced the binary are recorded next to it.
      - name: Verify ELF machine and record build metadata
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VARIANT: ${{ matrix.name }}
          BUILD_CPU: ${{ matrix.cpu }}
          BUILD_FEATURES: ${{ matrix.cpu_features }}
          BUILD_RUSTFLAGS: ${{ matrix.rustflags }}
          BUILD_CXXFLAGS: ${{ matrix.cxxflags }}
        run: |
          set -euo pipefail
          BIN="${CARGO_TARGET_DIR}/${BUILD_TARGET}/release/Zelvik-Edge"
          test -x "$BIN"
          MACHINE="$(${{ matrix.readelf }} -h "$BIN" | sed -n 's/^ *Machine: *//p')"
          echo "ELF machine: $MACHINE"
          if [ "$MACHINE" != "${{ matrix.elf_machine }}" ]; then
            echo "error: ${BUILD_VARIANT}: ELF machine '$MACHINE' != expected '${{ matrix.elf_machine }}'" >&2
            exit 1
          fi
          {
            echo "product_version=${ZELVIK_RELEASE_VERSION}"
            echo "variant=${BUILD_VARIANT}"
            echo "target=${BUILD_TARGET}"
            echo "cpu_baseline=${BUILD_CPU}"
            echo "cpu_features=${BUILD_FEATURES}"
            echo "rustflags=${BUILD_RUSTFLAGS}"
            echo "cxxflags=${BUILD_CXXFLAGS}"
            echo "rustc=$(rustc -V)"
            echo "elf_machine=$MACHINE"
            echo "binary_sha256=$(sha256sum "$BIN" | awk '{print $1}')"
          } > build-metadata.txt
          cat build-metadata.txt

      # The only real acceptance for the CLI version is executing the binary on
      # a CPU of the class the leg targets. Each leg now runs on a runner of its
      # own architecture, so a native build must actually execute here; only a
      # real cross-architecture leg (or a runner missing the leg's baseline) is
      # skipped loudly and left to the target machine — never faked.
      - name: Smoke-run on a matching CPU
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VARIANT: ${{ matrix.name }}
          REQUIRED_FLAGS: ${{ matrix.required_cpu_flags }}
        run: |
          set -euo pipefail
          BIN="${CARGO_TARGET_DIR}/${BUILD_TARGET}/release/Zelvik-Edge"
          case "$BUILD_TARGET" in
            x86_64-unknown-linux-gnu) TARGET_ARCH=x86_64; CPUINFO_FLAGS=flags ;;
            aarch64-unknown-linux-gnu) TARGET_ARCH=aarch64; CPUINFO_FLAGS=Features ;;
            *)
              echo "error: ${BUILD_VARIANT}: unknown target ${BUILD_TARGET}; no smoke-run definition" >&2
              exit 1
              ;;
          esac
          if [ "$(uname -m)" != "$TARGET_ARCH" ]; then
            echo "SKIP ${BUILD_VARIANT}: cross-built for ${BUILD_TARGET}; --version must be verified on a ${TARGET_ARCH} machine"
            exit 0
          fi
          HAVE="$(sed -n "s/^${CPUINFO_FLAGS}[[:space:]]*: //p" /proc/cpuinfo | head -1)"
          for flag in $(echo "$REQUIRED_FLAGS" | tr ',' ' '); do
            case " $HAVE " in
              *" $flag "*) ;;
              *) echo "SKIP ${BUILD_VARIANT}: runner CPU lacks $flag; --version must be verified on a matching machine"; exit 0 ;;
            esac
          done
          OUT="$("$BIN" --version)"
          echo "${BUILD_VARIANT}: $OUT"
          test "${OUT##* }" = "${ZELVIK_RELEASE_VERSION}" || {
            echo "error: ${BUILD_VARIANT}: --version reported '$OUT', expected ${ZELVIK_RELEASE_VERSION}" >&2
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${ZELVIK_RELEASE_VERSION:?product version must be resolved before packaging}"
          # 正式资产名，bootstrap 与许可站按此查找；补丁版本不引入新命名。
          PACKAGE_NAME="Zelvik-Edge-${{ matrix.name }}"

          # Re-verify the packaged object still matches what build.rs embedded.
          test "$(sha256sum ebpf-out/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" = "$(cat ebpf-out/sha256.txt)"

          mkdir -p dist/data
          cp "${CARGO_TARGET_DIR}/${{ matrix.target }}/release/Zelvik-Edge" dist/zelvik-edge
          chmod 0755 dist/zelvik-edge
          cp ebpf-out/zelvik-edge-xdp-ebpf.o dist/data/zelvik-edge-xdp-ebpf.o
          # deploy/install.sh is a template; the shipped copy carries the same
          # product version as the binary, and verify-release-package.sh fails
          # the job if the binary, installer, VERSION file and name disagree.
          sed -E "s|^VERSION=\"[0-9]+(\.[0-9]+){2,3}\"$|VERSION=\"${VERSION}\"|" deploy/install.sh > dist/install.sh
          chmod 0755 dist/install.sh
          printf '%s\n' "$VERSION" > dist/VERSION
          cp build-metadata.txt dist/BUILD-METADATA.txt
          # The installer writes the systemd unit from the package; shipping
          # without it fails only after files are already on disk.
          mkdir -p dist/systemd
          cp deploy/systemd/zelvik-edge.service dist/systemd/zelvik-edge.service
          {
            echo "product_version=${VERSION}"
            echo "binary=zelvik-edge target=${{ matrix.target }} variant=${{ matrix.name }}"
            echo "binary_sha256=$(sha256sum dist/zelvik-edge | awk '{print $1}')"
            echo "ebpf_sha256=$(cat ebpf-out/sha256.txt)"
          } > dist/SHA256SUMS.txt
          tar -czf "${PACKAGE_NAME}.tar.gz" -C dist \
            zelvik-edge data/zelvik-edge-xdp-ebpf.o install.sh VERSION BUILD-METADATA.txt \
            systemd/zelvik-edge.service SHA256SUMS.txt
          # Checksum and layout only. The CLI version is proven by executing the
          # binary on a matching CPU (previous step) or left to the target
          # machine; this script must not pretend otherwise.
          bash scripts/verify-release-package.sh "${PACKAGE_NAME}.tar.gz" --expect-version "$VERSION"

      # Binary packages go straight to the authenticated license portal. The
      # matrix never uploads the package itself as an Actions artifact; only the
      # small receipt is shared with the publish job.
      - name: Upload package to license portal
        if: needs.ebpf.outputs.publish == 'true'
        shell: bash
        env:
          PORTAL_URL: ${{ vars.ZELVIK_PORTAL_URL || 'https://license.zelvik.net' }}
          PORTAL_ADMIN_USER: ${{ secrets.ZELVIK_PORTAL_ADMIN_USER }}
          PORTAL_ADMIN_PASSWORD: ${{ secrets.ZELVIK_PORTAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${ZELVIK_RELEASE_VERSION:?product version must be resolved before upload}"
          python3 "${PIPELINE_DIR}/scripts/portal-publish.py" upload \
            --package "Zelvik-Edge-${{ matrix.name }}.tar.gz" \
            --version "${VERSION}" \
            --source-commit "${{ needs.ebpf.outputs.source_commit }}" \
            --receipt-dir receipts

      - name: Upload release receipt
        if: needs.ebpf.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ matrix.name }}
          path: receipts
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Notes
        shell: bash
        run: |
          mkdir -p .github/release-body
          RELEASE_NOTE="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$RELEASE_NOTE" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            RELEASE_NOTE="release-notes/${GITHUB_REF_NAME#v}.md"
          fi
          if [ -f "$RELEASE_NOTE" ]; then
            cp "$RELEASE_NOTE" .github/release-body/body.md
          else
            {
              echo "# ${GITHUB_REF_NAME}"
              echo
              echo "未找到对应的发布说明文件：release-notes/${GITHUB_REF_NAME}.md 或 release-notes/${GITHUB_REF_NAME#v}.md"
            } > .github/release-body/body.md
          fi

      - name: Package TOA Sources
        shell: bash
        run: |
          tar -czf zelvik-edge-toa-main-source.tar.gz toa-main
          tar -czf zelvik-edge-toa-sender-source.tar.gz toa-sender

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-body/body.md
          # Stable only. prepare rejects rc/beta/alpha tags before this job runs;
          # this flag must never turn a release into a prerelease.
          prerelease: false
          # Only source archives are attached. Binary packages are distributed
          # exclusively by license.zelvik.net and must never bypass its auth.
          files: |
            zelvik-edge-toa-main-source.tar.gz
            zelvik-edge-toa-sender-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Promotion is a separate job from the upload: it must see exactly the five
  # receipts, re-check the portal metadata AND the bytes actually downloaded
  # over authenticated HTTP, and only then move the stable channel. A missing
  # receipt, a duplicate, a 0-file release or a digest mismatch fails red and
  # never calls set-latest.
  publish:
    name: Verify receipts and promote stable
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PORTAL_URL: ${{ vars.ZELVIK_PORTAL_URL || 'https://license.zelvik.net' }}
      PORTAL_ADMIN_USER: ${{ secrets.ZELVIK_PORTAL_ADMIN_USER }}
      PORTAL_ADMIN_PASSWORD: ${{ secrets.ZELVIK_PORTAL_ADMIN_PASSWORD }}
      PORTAL_UPDATE_KEY: ${{ secrets.ZELVIK_PORTAL_UPDATE_KEY }}
    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download release receipts
        uses: actions/download-artifact@v4
        with:
          pattern: receipt-*
          path: receipts
          merge-multiple: true

      - name: Promote stable only after five verified downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/portal-publish.py promote \
            --receipts receipts \
            --version "${{ needs.prepare.outputs.version }}" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}"
