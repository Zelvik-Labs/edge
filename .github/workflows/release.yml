# Tag-driven Edge release.
#
# A v* tag publishes one immutable release: the GitHub Release carries the five
# verified CPU-variant packages (not just the TOA source archives), GHCR carries
# a linux/amd64+x86-64-v2 and linux/arm64-generic image assembled from those
# same binaries, and release-manifest.json joins all of it to the tag commit for
# the license backend to pull. There is no license-portal prepare/upload/promote
# step and no portal admin credential.
#
# All jobs use GitHub-hosted Ubuntu runners. The private dns dependency is
# checked out at one pinned commit (never main) and protocol is authenticated by
# PROTOCOL_DEPLOY_KEY or PROTOCOL_APP_TOKEN; a missing secret fails loudly
# before any build.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve tag and credentials
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      suite_version: ${{ steps.resolve.outputs.suite_version }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      - name: Checkout source tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Fail before any build with the exact missing secret. Protocol accepts
      # either the existing read-only deploy key or an App token; the private
      # dns dependency always needs its own deploy key.
      - name: Require private dependency credentials
        shell: bash
        env:
          ZELVIK_DNS_DEPLOY_KEY: ${{ secrets.ZELVIK_DNS_DEPLOY_KEY }}
          PROTOCOL_DEPLOY_KEY: ${{ secrets.PROTOCOL_DEPLOY_KEY }}
          PROTOCOL_APP_TOKEN: ${{ secrets.PROTOCOL_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ZELVIK_DNS_DEPLOY_KEY:-}" ]; then
            echo "::error::ZELVIK_DNS_DEPLOY_KEY is not configured; the pinned private dns dependency cannot be checked out." >&2
            exit 1
          fi
          if [ -z "${PROTOCOL_DEPLOY_KEY:-}" ] && [ -z "${PROTOCOL_APP_TOKEN:-}" ]; then
            echo "::error::Neither PROTOCOL_DEPLOY_KEY nor PROTOCOL_APP_TOKEN is configured; github.com/Zelvik-Labs/protocol cannot be fetched." >&2
            exit 1
          fi

      - name: Test release tooling
        shell: bash
        run: python3 scripts/test-release-manifest.py

      - name: Resolve tag, version and source commit
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            v*) ;;
            *) echo "::error::${TAG} is not a v* release tag" >&2; exit 1 ;;
          esac
          COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" || {
            echo "::error::${TAG} is not a tag in this checkout" >&2; exit 1;
          }
          [ "${TAG_COMMIT}" = "${COMMIT}" ] || {
            echo "::error::tag ${TAG} points at ${TAG_COMMIT}, but checkout is ${COMMIT}" >&2
            exit 1
          }

          # The product version is the tag, not a workflow literal. Cargo keeps
          # its three-segment package version; the optional fourth CalVer patch
          # segment exists only in the tag/product version.
          VERSION="${TAG#v}"
          CARGO_VERSION="$(bash scripts/release-version.sh --cargo-version)"
          if ! printf '%s' "${CARGO_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Cargo.toml version ${CARGO_VERSION} must stay exactly three numeric segments" >&2
            exit 1
          fi
          MANIFEST_VERSION="$(bash scripts/release-version.sh --print)"
          [ "${MANIFEST_VERSION}" = "${VERSION}" ] || {
            echo "::error::tag version ${VERSION} != VERSION-MANIFEST.toml product_version ${MANIFEST_VERSION}; update the manifest before tagging" >&2
            exit 1
          }
          SUITE_VERSION="$(printf '%s' "${VERSION}" | cut -d. -f1-2)"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "suite_version=${SUITE_VERSION}"
            echo "source_commit=${COMMIT}"
          } >> "${GITHUB_OUTPUT}"
          echo "source=${COMMIT} tag=${TAG} version=${VERSION} suite=${SUITE_VERSION}"

  # One eBPF build for the whole release. Every leg downloads the exact bytes
  # whose SHA256 was verified here, so build.rs embeds the packaged object and
  # holds it to the same digest (ZELVIK_EDGE_XDP_EBPF_SHA256).
  ebpf:
    name: Build eBPF object (shared)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      suite_version: ${{ needs.prepare.outputs.suite_version }}
      source_commit: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Build XDP eBPF Object
        shell: bash
        env:
          # bpf-linker is pinned to the combination verified in validation;
          # bumping it requires re-running the XDP/AF_XDP smoke matrix.
          BPF_LINKER_VERSION: "0.11.1"
        run: |
          set -euo pipefail
          # The dated nightly lives in one place only: the eBPF crate's
          # rust-toolchain.toml. xtask build-ebpf and build.rs resolve the same
          # channel, so the toolchain installed here is provably the one used.
          EBPF_NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/zelvik-edge-xdp-ebpf/rust-toolchain.toml | head -1)"
          test -n "$EBPF_NIGHTLY"
          rustup toolchain install "$EBPF_NIGHTLY" --profile minimal -c rust-src -c rustc-dev
          rustup run "$EBPF_NIGHTLY" rustc --version
          SYSROOT="$(rustup run "$EBPF_NIGHTLY" rustc --print sysroot)"
          ln -sf "$(find "$SYSROOT/lib" -name 'libLLVM.so.*' -print -quit)" "$SYSROOT/lib/libLLVM.so"
          LLVM_PREFIX="$SYSROOT" cargo +"$EBPF_NIGHTLY" install bpf-linker --version "$BPF_LINKER_VERSION" --locked
          bpf-linker --version
          rm -f data/zelvik-edge-xdp-ebpf.o
          cargo xtask build-ebpf
          test -s data/zelvik-edge-xdp-ebpf.o
          mkdir -p ebpf-out
          cp data/zelvik-edge-xdp-ebpf.o ebpf-out/zelvik-edge-xdp-ebpf.o
          sha256sum ebpf-out/zelvik-edge-xdp-ebpf.o | awk '{print $1}' > ebpf-out/sha256.txt
          cat ebpf-out/sha256.txt

      - name: Upload shared eBPF object
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-object
          path: ebpf-out
          if-no-files-found: error
          retention-days: 3

  # Five matrix legs run in parallel, one runner each: no leg waits on another
  # leg's cache, target directory or toolchain.
  build:
    name: Build - ${{ matrix.name }}
    needs: ebpf
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Job-level so every step (build, ELF check, smoke run, package) sees the
    # same directory under set -u; a step-local env would be unbound later.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/${{ matrix.name }}
      # Fetch private git dependencies through the git CLI. cargo's libgit2
      # backend ignores the URL rewrites installed by the credential steps.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Five independent legs, one runner each. Asset names are the official
          # release names the bootstrap and license site already expect; a
          # patch release must not rename them.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cpu: x86-64-v2
            name: linux-x64-v2-sse4.2
            cache_key: x64-v2-pclmul
            rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
            cpu_features: "+pclmulqdq"
            required_cpu_flags: "pclmulqdq,sse4_2"
            readelf: readelf
            elf_machine: "Advanced Micro Devices X86-64"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cpu: x86-64-v3
            name: linux-x64-v3-avx2
            cache_key: x64-v3-avx2
            rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
            cpu_features: "+pclmulqdq"
            required_cpu_flags: "avx2,bmi2,fma"
            readelf: readelf
            elf_machine: "Advanced Micro Devices X86-64"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cpu: x86-64-v4
            name: linux-x64-v4-avx512
            cache_key: x64-v4-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C target-feature=+pclmulqdq"
            cxxflags: "-mpclmul -msse4.2"
            cpu_features: "+pclmulqdq"
            required_cpu_flags: "avx512f,avx512bw,avx512vl,avx512dq"
            readelf: readelf
            elf_machine: "Advanced Micro Devices X86-64"
          # --- ARM64 Variants ---
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cpu: generic
            name: linux-arm64-generic
            cache_key: arm64-generic-crypto
            rustflags: "-C target-feature=+neon,+aes,+sha2,+crc"
            cxxflags: ""
            cpu_features: "+neon,+aes,+sha2,+crc"
            required_cpu_flags: "asimd,aes,sha2,crc32"
            readelf: readelf
            elf_machine: AArch64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cpu: neoverse-n1
            name: linux-arm64-neoverse-n1
            cache_key: arm64-n1
            rustflags: "-C target-cpu=neoverse-n1"
            cxxflags: ""
            cpu_features: "+neon,+aes,+sha2,+crc"
            required_cpu_flags: "asimd,aes,sha2,crc32"
            readelf: readelf
            elf_machine: AArch64

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.ebpf.outputs.source_commit }}
          fetch-depth: 1

      # Product version comes from the tag, already validated against
      # VERSION-MANIFEST.toml by the prepare job. The existing consistency and
      # packaging tests still run before the expensive build.
      - name: Resolve and check product version
        shell: bash
        env:
          VERSION: ${{ needs.ebpf.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/check-version-consistency.sh
          bash scripts/test-release-packaging.sh
          echo "ZELVIK_RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "product version: ${VERSION}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Normalize Rust Toolchains
        shell: bash
        env:
          RELEASE_RUST_VERSION: "1.99.1"
        run: |
          set -euo pipefail

          rustup default "$RELEASE_RUST_VERSION"
          rustup target add "${{ matrix.target }}" --toolchain "$RELEASE_RUST_VERSION"

          while IFS= read -r line; do
            toolchain="${line%% *}"
            if [ -z "$toolchain" ]; then
              continue
            fi

            case "$toolchain" in
              "$RELEASE_RUST_VERSION"|"$RELEASE_RUST_VERSION"-*)
                ;;
              *)
                rustup toolchain uninstall "$toolchain" || true
                ;;
            esac
          done < <(rustup toolchain list --quiet)

          rustup toolchain list --quiet

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # Native arm64 runners need neither amd64 mirror pinning nor x86 cross
          # toolchains: install the native packages and stop here.
          if [ "$(uname -m)" != "x86_64" ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends cmake build-essential protobuf-compiler pkg-config libelf-dev zlib1g-dev libpcap0.8-dev
            exit 0
          fi

          packages=(cmake build-essential golang-go protobuf-compiler pkg-config libelf-dev zlib1g-dev libpcap0.8-dev)

          # GitHub ubuntu-22.04 runners pin apt to azure.archive.ubuntu.com via
          # Mirrorlist. When that host stalls, apt-get update hangs until the
          # job timeout. Pin archive.ubuntu.com (and ports for arm64) instead.
          sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          sudo mkdir -p /etc/apt/sources.list.d.disabled
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.d.disabled/sources.list 2>/dev/null || true
          sudo mv /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d.disabled/apt-mirrors.txt 2>/dev/null || true
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -e "$source" ] || continue
            sudo mv "$source" /etc/apt/sources.list.d.disabled/
          done
          sudo tee /etc/apt/sources.list.d/ubuntu-amd64.list >/dev/null <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF

          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ] && [ "$(uname -m)" = "x86_64" ]; then
            sudo dpkg --add-architecture arm64
            sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
            packages+=(gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libelf-dev:arm64 zlib1g-dev:arm64 libpcap0.8-dev:arm64)
          fi
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

      # The eBPF object is built exactly once (job "ebpf") and reused by every
      # leg. build.rs holds the embedded object to the recorded SHA256, so a
      # missing or substituted artifact fails the build instead of embedding a
      # stale object.
      - name: Download shared eBPF object
        uses: actions/download-artifact@v4
        with:
          name: ebpf-object
          path: ebpf-out

      - name: Verify shared eBPF object
        shell: bash
        run: |
          set -euo pipefail
          test -s ebpf-out/zelvik-edge-xdp-ebpf.o
          test -s ebpf-out/sha256.txt
          test "$(sha256sum ebpf-out/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" = "$(cat ebpf-out/sha256.txt)"
          echo "shared eBPF sha256: $(cat ebpf-out/sha256.txt)"

      # zelvik-geo-runtime lives in the private dns repo and is referenced as
      # ../dns/crates/zelvik-geo-runtime. It is pinned to the known commit
      # below, never cloned from main: a moving dependency would make the same
      # tag rebuild a different tree.
      - name: Checkout pinned private dns dependency
        uses: actions/checkout@v5
        with:
          repository: Zelvik-Labs/dns
          ref: aca0f3bb61bc498682b10900b4886709a2c248b8
          ssh-key: ${{ secrets.ZELVIK_DNS_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/dns

      - name: Link sibling geo runtime path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/../dns"
          ln -s "$GITHUB_WORKSPACE/.ci/dns" "$GITHUB_WORKSPACE/../dns"
          test -d "$GITHUB_WORKSPACE/../dns/crates/zelvik-geo-runtime"

      # The private protocol dependency is authenticated by exactly one of the
      # existing read-only deploy key or an App token. No personal token and no
      # "best effort" fallback is allowed: without either, this fails red.
      - name: Configure private protocol credentials
        shell: bash
        env:
          PROTOCOL_DEPLOY_KEY: ${{ secrets.PROTOCOL_DEPLOY_KEY }}
          PROTOCOL_APP_TOKEN: ${{ secrets.PROTOCOL_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PROTOCOL_DEPLOY_KEY:-}" ]; then
            key="$RUNNER_TEMP/protocol_deploy_key"
            install -m 600 /dev/null "$key"
            printf '%s\n' "$PROTOCOL_DEPLOY_KEY" > "$key"
            curl -fsSL https://api.github.com/meta \
              | grep -oE '"ssh-[a-z0-9-]+ [A-Za-z0-9+/=]+"' \
              | tr -d '"' | sed 's/^/github.com /' > "$RUNNER_TEMP/known_hosts"
            {
              echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.git@github.com:Zelvik-Labs/protocol.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/Zelvik-Labs/protocol"
            } >> "$GITHUB_ENV"
          elif [ -n "${PROTOCOL_APP_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${PROTOCOL_APP_TOKEN}@github.com/Zelvik-Labs/protocol".insteadOf \
              "https://github.com/Zelvik-Labs/protocol"
            git config --global \
              url."https://x-access-token:${PROTOCOL_APP_TOKEN}@github.com/Zelvik-Labs/protocol".insteadOf \
              "git@github.com:Zelvik-Labs/protocol"
            echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          else
            echo "::error::Neither PROTOCOL_DEPLOY_KEY nor PROTOCOL_APP_TOKEN is configured; protocol cannot be fetched." >&2
            exit 1
          fi

      - name: Cargo dependency source cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.global-cache
          key: release-cargo-sources-v1-${{ matrix.cache_key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-cargo-sources-v1-${{ matrix.cache_key }}-

      # Independent target directory per leg: no leg can poison another leg's
      # incremental state, and the key pins target + CPU flags + toolchain +
      # lockfile so a stale cache can never satisfy a different ISA build.
      - name: Target cache (per leg)
        uses: actions/cache@v4
        with:
          path: target/${{ matrix.name }}
          key: release-target-v1-${{ matrix.cache_key }}-${{ matrix.target }}-rust1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-target-v1-${{ matrix.cache_key }}-${{ matrix.target }}-rust1.99.1-

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          CFLAGS: ${{ matrix.cxxflags }}
          ZELVIK_EDGE_XDP_EBPF_SOURCE: ebpf-out/zelvik-edge-xdp-ebpf.o
        run: |
          set -euo pipefail
          ZELVIK_EDGE_XDP_EBPF_SHA256="$(cat ebpf-out/sha256.txt)"
          export ZELVIK_EDGE_XDP_EBPF_SHA256
          # Use native tools on the arm64 runners. The prefixed cross compiler
          # is installed only when building ARM on an x86_64 host.
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            tool_prefix=""
            if [ "$(uname -m)" != "aarch64" ]; then
              tool_prefix="aarch64-linux-gnu-"
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
            fi
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${tool_prefix}gcc"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR="${tool_prefix}ar"
            export CC="${tool_prefix}gcc"
            export CXX="${tool_prefix}g++"
            export LD="${tool_prefix}ld"
            export AR="${tool_prefix}ar"
            export OBJCOPY="${tool_prefix}objcopy"
            export READELF="${tool_prefix}readelf"
            export CC_aarch64_unknown_linux_gnu="$CC"
            export CXX_aarch64_unknown_linux_gnu="$CXX"
            export AR_aarch64_unknown_linux_gnu="$AR"
            for tool in "$CC" "$CXX" "$LD" "$AR" "$OBJCOPY" "$READELF"; do
              command -v "$tool"
            done
          fi

          cargo build --release --target ${{ matrix.target }} --bin Zelvik-Edge

      # Compiler CPU flags do not guarantee that a specific opcode appears in
      # the final binary (dead code, inlining, LTO), so we do not assert
      # opcodes. What must hold is the architecture the package claims: the ELF
      # machine is checked here, and the CPU baseline / target features /
      # toolchain that actually produced the binary are recorded next to it.
      - name: Verify ELF machine and record build metadata
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VARIANT: ${{ matrix.name }}
          BUILD_CPU: ${{ matrix.cpu }}
          BUILD_FEATURES: ${{ matrix.cpu_features }}
          BUILD_RUSTFLAGS: ${{ matrix.rustflags }}
          BUILD_CXXFLAGS: ${{ matrix.cxxflags }}
        run: |
          set -euo pipefail
          BIN="${CARGO_TARGET_DIR}/${BUILD_TARGET}/release/Zelvik-Edge"
          test -x "$BIN"
          MACHINE="$(${{ matrix.readelf }} -h "$BIN" | sed -n 's/^ *Machine: *//p')"
          echo "ELF machine: $MACHINE"
          if [ "$MACHINE" != "${{ matrix.elf_machine }}" ]; then
            echo "error: ${BUILD_VARIANT}: ELF machine '$MACHINE' != expected '${{ matrix.elf_machine }}'" >&2
            exit 1
          fi
          {
            echo "product_version=${ZELVIK_RELEASE_VERSION}"
            echo "variant=${BUILD_VARIANT}"
            echo "target=${BUILD_TARGET}"
            echo "cpu_baseline=${BUILD_CPU}"
            echo "cpu_features=${BUILD_FEATURES}"
            echo "rustflags=${BUILD_RUSTFLAGS}"
            echo "cxxflags=${BUILD_CXXFLAGS}"
            echo "rustc=$(rustc -V)"
            echo "elf_machine=$MACHINE"
            echo "binary_sha256=$(sha256sum "$BIN" | awk '{print $1}')"
          } > build-metadata.txt
          cat build-metadata.txt

      # The only real acceptance for the CLI version is executing the binary on
      # a CPU of the class the leg targets. Each leg now runs on a runner of its
      # own architecture, so a native build must actually execute here; only a
      # real cross-architecture leg (or a runner missing the leg's baseline) is
      # skipped loudly and left to the target machine — never faked.
      - name: Smoke-run on a matching CPU
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VARIANT: ${{ matrix.name }}
          REQUIRED_FLAGS: ${{ matrix.required_cpu_flags }}
        run: |
          set -euo pipefail
          BIN="${CARGO_TARGET_DIR}/${BUILD_TARGET}/release/Zelvik-Edge"
          case "$BUILD_TARGET" in
            x86_64-unknown-linux-gnu) TARGET_ARCH=x86_64; CPUINFO_FLAGS=flags ;;
            aarch64-unknown-linux-gnu) TARGET_ARCH=aarch64; CPUINFO_FLAGS=Features ;;
            *)
              echo "error: ${BUILD_VARIANT}: unknown target ${BUILD_TARGET}; no smoke-run definition" >&2
              exit 1
              ;;
          esac
          if [ "$(uname -m)" != "$TARGET_ARCH" ]; then
            echo "SKIP ${BUILD_VARIANT}: cross-built for ${BUILD_TARGET}; --version must be verified on a ${TARGET_ARCH} machine"
            exit 0
          fi
          HAVE="$(sed -n "s/^${CPUINFO_FLAGS}[[:space:]]*: //p" /proc/cpuinfo | head -1)"
          for flag in $(echo "$REQUIRED_FLAGS" | tr ',' ' '); do
            case " $HAVE " in
              *" $flag "*) ;;
              *) echo "SKIP ${BUILD_VARIANT}: runner CPU lacks $flag; --version must be verified on a matching machine"; exit 0 ;;
            esac
          done
          OUT="$("$BIN" --version)"
          echo "${BUILD_VARIANT}: $OUT"
          test "${OUT##* }" = "${ZELVIK_RELEASE_VERSION}" || {
            echo "error: ${BUILD_VARIANT}: --version reported '$OUT', expected ${ZELVIK_RELEASE_VERSION}" >&2
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${ZELVIK_RELEASE_VERSION:?product version must be resolved before packaging}"
          # 正式资产名，bootstrap 与许可站按此查找；补丁版本不引入新命名。
          PACKAGE_NAME="Zelvik-Edge-${{ matrix.name }}"

          # Re-verify the packaged object still matches what build.rs embedded.
          test "$(sha256sum ebpf-out/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" = "$(cat ebpf-out/sha256.txt)"

          mkdir -p dist/data
          cp "${CARGO_TARGET_DIR}/${{ matrix.target }}/release/Zelvik-Edge" dist/zelvik-edge
          chmod 0755 dist/zelvik-edge
          cp ebpf-out/zelvik-edge-xdp-ebpf.o dist/data/zelvik-edge-xdp-ebpf.o
          # deploy/install.sh is a template; the shipped copy carries the same
          # product version as the binary, and verify-release-package.sh fails
          # the job if the binary, installer, VERSION file and name disagree.
          sed -E "s|^VERSION=\"[0-9]+(\.[0-9]+){2,3}\"$|VERSION=\"${VERSION}\"|" deploy/install.sh > dist/install.sh
          chmod 0755 dist/install.sh
          printf '%s\n' "$VERSION" > dist/VERSION
          cp build-metadata.txt dist/BUILD-METADATA.txt
          # The installer writes the systemd unit from the package; shipping
          # without it fails only after files are already on disk.
          mkdir -p dist/systemd
          cp deploy/systemd/zelvik-edge.service dist/systemd/zelvik-edge.service
          {
            echo "product_version=${VERSION}"
            echo "binary=zelvik-edge target=${{ matrix.target }} variant=${{ matrix.name }}"
            echo "binary_sha256=$(sha256sum dist/zelvik-edge | awk '{print $1}')"
            echo "ebpf_sha256=$(cat ebpf-out/sha256.txt)"
          } > dist/SHA256SUMS.txt
          tar -czf "${PACKAGE_NAME}.tar.gz" -C dist \
            zelvik-edge data/zelvik-edge-xdp-ebpf.o install.sh VERSION BUILD-METADATA.txt \
            systemd/zelvik-edge.service SHA256SUMS.txt
          # Checksum and layout only. The CLI version is proven by executing the
          # binary on a matching CPU (previous step) or left to the target
          # machine; this script must not pretend otherwise.
          bash scripts/verify-release-package.sh "${PACKAGE_NAME}.tar.gz" --expect-version "$VERSION"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: Zelvik-Edge-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release, image and manifest
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 1

      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Verify package set and versions
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for name in linux-x64-v2-sse4.2 linux-x64-v3-avx2 linux-x64-v4-avx512 linux-arm64-generic linux-arm64-neoverse-n1; do
            pkg="release/Zelvik-Edge-${name}.tar.gz"
            test -s "$pkg" || { echo "::error::missing ${pkg}" >&2; exit 1; }
            packaged_version="$(tar -xOzf "$pkg" VERSION)"
            [ "$packaged_version" = "$VERSION" ] || {
              echo "::error::${pkg} reports version ${packaged_version}, expected ${VERSION}" >&2
              exit 1
            }
          done

      # The image reuses the exact binaries from the verified packages. Only
      # the x64-v2 and arm64-generic legs are the documented defaults; the
      # other three variants remain archive-only.
      - name: Assemble image context from verified packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-context/amd64 docker-context/arm64
          tar -xOzf release/Zelvik-Edge-linux-x64-v2-sse4.2.tar.gz zelvik-edge > docker-context/amd64/zelvik-edge
          tar -xOzf release/Zelvik-Edge-linux-arm64-generic.tar.gz zelvik-edge > docker-context/arm64/zelvik-edge
          chmod 0755 docker-context/amd64/zelvik-edge docker-context/arm64/zelvik-edge
          test "$(sha256sum docker-context/amd64/zelvik-edge | awk '{print $1}')" = \
            "$(tar -xOzf release/Zelvik-Edge-linux-x64-v2-sse4.2.tar.gz BUILD-METADATA.txt | sed -n 's/^binary_sha256=//p')"
          test "$(sha256sum docker-context/arm64/zelvik-edge | awk '{print $1}')" = \
            "$(tar -xOzf release/Zelvik-Edge-linux-arm64-generic.tar.gz BUILD-METADATA.txt | sed -n 's/^binary_sha256=//p')"
          cp docker/Dockerfile.zelvik-edge docker-context/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No Rust toolchain here: the Dockerfile copies the packaged binaries.
      # The multi-arch index is the default image; x64-v2 is the fleet floor and
      # arm64 generic avoids a SIGILL on older ARM hosts.
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/docker-context
          file: ${{ github.workspace }}/docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zelvik-labs/zelvik-edge:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_commit }}

      - name: Write release manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${IMAGE_DIGEST:?build-push-action returned no image digest}"
          python3 scripts/release_manifest.py \
            --repository "${{ github.repository }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --version "${VERSION}" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}" \
            --component Zelvik-Edge \
            --assets release/Zelvik-Edge-*.tar.gz \
            --image "Zelvik-Edge=ghcr.io/zelvik-labs/zelvik-edge:${VERSION}@${IMAGE_DIGEST}" \
            --output release/release-manifest.json

      - name: Prepare release notes
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ghcr.io/zelvik-labs/zelvik-edge:${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          note="release-notes/${TAG}.md"
          if [ -f "$note" ]; then
            cp "$note" release-body.md
          else
            {
              echo "# ${TAG}"
              echo
              echo "Zelvik-Edge ${VERSION}"
              echo
              echo "Container image: \`${IMAGE}\`"
              echo
              echo "See \`release-manifest.json\` for package hashes and the image digest."
            } > release-body.md
          fi

      # The TOA trees stay attached, but the release is no longer source-only:
      # the five binary packages and the manifest are the primary assets.
      - name: Package TOA sources
        shell: bash
        run: |
          set -euo pipefail
          tar -czf release/zelvik-edge-toa-main-source.tar.gz toa-main
          tar -czf release/zelvik-edge-toa-sender-source.tar.gz toa-sender

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-body.md
          prerelease: false
          files: |
            release/Zelvik-Edge-*.tar.gz
            release/zelvik-edge-toa-main-source.tar.gz
            release/zelvik-edge-toa-sender-source.tar.gz
            release/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
