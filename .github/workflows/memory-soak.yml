            --controller-bin target/debug/examples/issue34-controller \
            --home "$OUT/home" \
            --report "$OUT/smoke-report.json" \
            | tee "$OUT/summary.json"
          python3 -I - "$OUT/summary.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["status"] == "pass", report.get("failures")
          scope = report["scope"]
          assert scope["full_edge"] is True, scope
          assert scope["production_startup"] is True, scope
          assert scope["component_lane"] is False, scope
          assert report["node_health_observed"] is True, report
          assert report["edge_pid"] == report["pid_at_exit"], report
          checks = {item["name"]: item for item in report["checks"]}
          assert checks["http1-post"]["ok"] is True, checks.get("http1-post")
          assert checks["http2-post"]["ok"] is True, checks.get("http2-post")
          assert checks["http1-post"]["http_version"].startswith("1."), checks
          assert checks["http2-post"]["http_version"] == "2", checks
          assert checks["node-status"]["ok"] is True, checks.get("node-status")
          assert checks["telemetry-retryable-recovery"]["ok"] is True, (
