      - name: Full-Edge production-startup smoke (mandatory)
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/issue34-full-edge-smoke"
          mkdir -p "$OUT"
          python3 -I scripts/memory/full_edge.py smoke \
