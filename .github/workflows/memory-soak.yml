          assert checks["telemetry-reject"]["ok"] is True, checks.get("telemetry-reject")
          telemetry = report["telemetry"]
          assert telemetry["mode"] == "unimplemented", telemetry
          assert telemetry["served"] is False, telemetry
          assert telemetry["expected_code_number"] == 12, telemetry
          print(json.dumps({"status": report["status"], "scope": scope,
                            "edge_pid": report["edge_pid"],
                            "checks": sorted(checks)}, indent=2))
          PY

      # Telemetry closure on this lane: the fixture starts in `unavailable`
      # (retryable UNAVAILABLE), so the real Edge must retain complete
      # batches in its bounded on-disk store. `--recovery-seconds 60` switches
      # the fixture to the durable success backend near the end and requires
      # the retained backlog to be acknowledged with a real receipt. The store
      # is under $RUNNER_TEMP for this run only; a fake or unbounded ack fails
      # the assertions below. Terminal UNIMPLEMENTED is covered by the smoke.
      - name: 15 min full-Edge screen soak (automatic)
        run: |
          set -euo pipefail
          # 900 s of soak, excluding image/Rust/eBPF build time. 120 s warm-up;
          # pressure starts at 120 s (steady-state baseline, not 18 s during
          # Edge startup) and two cycles of 15 s hold + 10 s recovery probe
          # finish by ~200 s. A >=10 s clean-2xx handshake follows, then a
          # bounded wait (<=180 s) for the released cgroup's RSS refill ramp to
          # flatten (trailing 30 s rate <=8 MiB/min for two windows). The
          # measurement window therefore contains no pressure, settle, 503 tail
          # or refill ramp; the remaining span is >=300 s.
          # 8 MiB/h is a fast screen, never the 0.5 MiB/h long-lane closure.
          # Allocator pages are MAP_PRIVATE|MAP_ANONYMOUS, so with swap=0 they
          # cannot be reclaimed and readiness is a real resident proof.
          # --pressure-bytes is an upper bound: pressure.py caps each cycle at
          # memory.high + 16 MiB with 256 MiB reserve below memory.max, so a
          # 1.5 GiB request cannot livelock above high=1.5 GiB (CI run
          # 40089866696). Resident proof is bounded at 120 s independent of hold
          # and logs cgroup snapshots.
          OUT="$RUNNER_TEMP/issue34-full-edge-nightly"
          mkdir -p "$OUT"
          sudo systemd-run --scope \
            --property=MemoryMax=2G \
            --property=MemoryHigh=1536M \
            --property=MemorySwapMax=0 \
            --setenv=PATH=/usr/local/bin:/usr/bin:/bin \
            --setenv=ISSUE34_REQUIRE_LINUX=1 \
            --working-directory="$GITHUB_WORKSPACE" \
            -- python3 -I scripts/memory/full_edge.py soak \
              --edge-binary "$GITHUB_WORKSPACE/target/debug/Zelvik-Edge" \
              --controller-bin "$GITHUB_WORKSPACE/target/debug/examples/issue34-controller" \
              --home "$OUT/home" \
              --run-dir "$OUT/run" \
              --duration 900 \
              --out "$OUT/report.json" \
              --require-node-status \
              --telemetry-mode unavailable \
              --recovery-seconds 60 \
              --soak-arg=--screen-only \
              --soak-arg=--warmup-seconds --soak-arg=120 \
              --soak-arg=--min-span-seconds --soak-arg=300 \
              --soak-arg=--sample-interval --soak-arg=2 \
              --soak-arg=--budget-mib-per-hour --soak-arg=8 \
              --soak-arg=--anon-budget-mib-per-hour --soak-arg=8 \
              --soak-arg=--max-rss-mib --soak-arg=1536 \
              --soak-arg=--pressure-cycles --soak-arg=2 \
              --soak-arg=--pressure-start-fraction --soak-arg=0.13333333333333333 \
              --soak-arg=--measurement-clean-seconds --soak-arg=10 \
              --soak-arg=--pressure-bytes --soak-arg=1610612736 \
              --soak-arg=--pressure-hold-seconds --soak-arg=15 \
              --soak-arg=--pressure-settle-seconds --soak-arg=30 \
              --soak-arg=--pressure-recovery-probe-seconds --soak-arg=10 \
              --soak-arg=--min-requests --soak-arg=1000 \
              --soak-arg=--max-load-errors --soak-arg=10 \
            | tee "$OUT/summary.json"
          python3 -I - "$OUT/summary.json" "$OUT/report.json" <<'PY'
          import json, os, sys
          summary = json.load(open(sys.argv[1]))
          report = json.load(open(sys.argv[2]))
          assert summary["status"] == "pass", summary
          assert summary["soak_exit_code"] == 0, summary
          # The fixture starts unavailable, so the Edge must retain batches,
          # then recover and acknowledge them with a real receipt once the
          # backend returns. The durable store is a bounded file under
          # $RUNNER_TEMP, never a production path and never a fake ack.
          recovery = summary["telemetry_recovery"]
          assert recovery is not None, summary
          assert recovery["status"] == "pass", recovery
          assert recovery["mode"] == "unavailable->success", recovery
          assert recovery["pending_before"] >= 1, recovery
          assert recovery["pending_after"] == 0, recovery
          assert recovery["acked_sequence"] >= recovery["max_sequence"], recovery
          assert 0 < recovery["max_batch_bytes"] <= 8 * 1024 * 1024, recovery
          assert recovery["bounded_status"] is True, recovery
          assert summary["telemetry_mode"] == "unavailable", summary
          assert summary["telemetry_store"].startswith(os.environ["RUNNER_TEMP"] + "/"), summary
          assert report["verdict"] == "pass", report["violations"]
          scope = report["scope"]
          assert scope["full_edge"] is True, scope
          assert scope["production_startup"] is True, scope
          assert scope["component_lane"] is False, scope
          assert report["screen_only"] is True
          assert "SCREEN ONLY" in report["screen_note"]
          assert report["duration_seconds"] >= 880, report["duration_seconds"]
          # Pressure and the clean-load handshake are before measurement_start.
          # Expected samples are therefore the contiguous measured-window
          # count, not total uptime minus a guessed blocked interval.
          assert report["pressure_before_measurement"] is True, report["pressure"]
          assert report["pressure_end_offset_seconds"] < report["measurement_start_offset_seconds"], report["pressure"]
          assert report["pressure_end_offset_seconds"] <= 200, report["pressure"]
          assert report["measurement"]["handshake_seconds"] >= 10, report["measurement"]
          # Pressure's RSS refill ramp must have flattened before measurement.
          assert report["measurement_stabilization_end_offset_seconds"] <= report["measurement_start_offset_seconds"], report["measurement"]
          assert report["measurement"]["stabilization_plateaued"] is True, report["measurement"]
          assert report["measurement"]["plateau_rate_mib_per_min"] <= report["measurement"]["stabilization_max_rate_mib_per_min"], report["measurement"]
          assert report["measurement"]["load_errors"] <= 10, report["measurement"]
          assert report["pressure"]["pressure_load_errors"] >= 0, report["pressure"]
          assert report["expected_samples"] > 0, report
          assert report["measurement_samples"] >= report["expected_samples"] * 0.9, (
              report["measurement_samples"], report["expected_samples"])
          assert report["target"]["same_pid"] is True
          # Real TLS/HTTP2 startup was asserted by the smoke above; the soak
          # also re-verifies CA/SNI/ALPN/payload on a periodic cadence.
          assert report["tls_verification"]["periodic_count"] >= 1
          assert report["tls_verification"]["errors"] == [], report["tls_verification"]
          assert report["slope"]["ok"] is True, report["slope"]
          assert report["anon_slope"]["ok"] is True, report["anon_slope"]
          for name in ("slope", "anon_slope"):
              assert report[name]["budget_mib_per_hour"] <= 8, report[name]
              assert report[name]["upper95_mib_per_hour"] < 8, report[name]
              assert report[name]["theil_sen_mib_per_hour"] < 8, report[name]
          assert report["slope"]["span_seconds"] >= 300, report["slope"]
          assert report["slope"]["samples"] >= 200, report["slope"]
          # Required node counters must be present and live. The real Edge
          # honestly reports unhooked Pingora workers, so the coverage gap is
          # reported explicitly; it is not skipped and not treated as full
          # worker coverage.
          assert report["node_status"]["required"] is True
          assert report["node_status"]["samples"] >= 10, report["node_status"]
          last = report["node_status"]["last"]
          assert last is not None
          # Presence and monotonicity are checked on every sample; zero is a
          # valid value when no reclaim/janitor cycle has happened yet.
          assert last["workerReclaim.generation"] >= 0
          assert last["cacheJanitor.cycles"] >= 0
          # Actual allocator-cache accounting must be present and consistent.
          assert last["metricValuesCache.estimatedBytes"] >= 0
          assert last["metricsAggregatorBytes"] >= last["metricValuesCache.estimatedBytes"]
          assert last["workerReclaim.coversAllWorkers"] is False
          gap = report["node_status"]["coverage_gap"]
          assert gap is not None, report["node_status"]
          assert gap["value"] is False
          assert gap["unhookedPingoraWorkers"] >= 1, gap
          # OOM is enforced by the soak's cgroup event check and `verdict`;
          # this is a fast screen, so it uses 2 early pressure cycles instead
          # of the long-lane 10 x 60 s contract.
          assert report["pressure"]["cycles"] == 2
          probe = report["pressure"]["result"]
          assert probe["long_recovery"] is False
          assert probe["hold_seconds"] >= 15
          assert probe["recovery_probe_seconds"] >= 10
          assert probe["recovery_probe_samples"] >= 5, probe
          print(json.dumps({"status": summary["status"], "scope": scope,
                            "slope": report["slope"], "anon_slope": report["anon_slope"],
                            "edge_pid": report["target"]["pid"]}, indent=2))
          PY

      - name: Diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/issue34-full-edge-nightly"
          [ -f "$OUT/report.json" ] && cat "$OUT/report.json" || true
          [ -f "$OUT/summary.json" ] && cat "$OUT/summary.json" || true
          [ -f "$OUT/run/edge.log" ] && tail -n 120 "$OUT/run/edge.log" || true
          [ -f "$OUT/run/controller.log" ] && tail -n 120 "$OUT/run/controller.log" || true

  dedicated:
    name: Dedicated full-Edge soak (>=48 h, explicit input)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dedicated_hours != '0'
    # The label must map to a host dedicated to this job; preflight below
    # refuses GitHub-hosted runners and any host running production Edge.
    runs-on: [self-hosted, issue34-dedicated]
    timeout-minutes: 4380
    steps:
      - name: Preflight dedicated runner (not production, not hosted)
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "::error::dedicated soak requires a self-hosted runner; RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset}"
            exit 1
          fi
          if [ ! -f /etc/zelvik/issue34-dedicated-runner ]; then
            echo "::error::missing /etc/zelvik/issue34-dedicated-runner marker; refusing to treat this host as dedicated"
            exit 1
          fi
          if pgrep -x 'Zelvik-Edge' >/dev/null || pgrep -x 'zelvik-edge' >/dev/null; then
            echo "::error::production Edge process is running on this host; refusing dedicated soak"
            exit 1
          fi
          if systemctl is-active --quiet zelvik-edge 2>/dev/null; then
            echo "::error::zelvik-edge service is active; refusing dedicated soak"
            exit 1
          fi
          for tool in systemd-run python3 openssl curl cmake protoc clang; do
            command -v "$tool" >/dev/null || { echo "::error::dedicated host is missing $tool"; exit 1; }
          done
          systemctl is-system-running >/dev/null 2>&1 || systemctl --version >/dev/null
          hours='${{ github.event.inputs.dedicated_hours }}'
          case "$hours" in (*[!0-9]*|'') echo "::error::dedicated_hours must be an integer"; exit 1;; esac
          if [ "$hours" -lt 48 ]; then
            echo "::error::dedicated_hours must be >= 48 (got $hours)"
            exit 1
          fi
          echo "ISSUE34_DEDICATED_HOURS=$hours" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Checkout pinned geo runtime dependency
        uses: actions/checkout@v5
        with:
          repository: Zelvik-Labs/dns
          ref: ${{ env.DNS_REF }}
          ssh-key: ${{ secrets.ZELVIK_DNS_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci/dns

      - name: Link sibling geo runtime path
        run: ln -s "$GITHUB_WORKSPACE/.ci/dns" "$GITHUB_WORKSPACE/../dns"

      - name: Read-only protocol deploy key
        run: |
          set -euo pipefail
          if [ -z "${PROTOCOL_DEPLOY_KEY:-}" ]; then
            echo "::error::PROTOCOL_DEPLOY_KEY is required for the private protocol dependency."
            exit 1
          fi
          key="$RUNNER_TEMP/protocol_deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$PROTOCOL_DEPLOY_KEY" > "$key"
          curl -fsSL https://api.github.com/meta \
            | grep -oE '"ssh-[a-z0-9-]+ [A-Za-z0-9+/=]+"' \
            | tr -d '"' | sed 's/^/github.com /' > "$RUNNER_TEMP/known_hosts"
          {
            echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.git@github.com:Zelvik-Labs/protocol.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/Zelvik-Labs/protocol"
          } >> "$GITHUB_ENV"
        env:
          PROTOCOL_DEPLOY_KEY: ${{ secrets.PROTOCOL_DEPLOY_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            pingora-main -> pingora-main/target

      - name: Build eBPF object
        run: |
          set -euo pipefail
          EBPF_NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/zelvik-edge-xdp-ebpf/rust-toolchain.toml | head -1)"
          test -n "$EBPF_NIGHTLY"
          rustup toolchain install "$EBPF_NIGHTLY" --profile minimal -c rust-src -c rustc-dev
          SYSROOT="$(rustup run "$EBPF_NIGHTLY" rustc --print sysroot)"
          ln -sf "$(find "$SYSROOT/lib" -name 'libLLVM.so.*' -print -quit)" "$SYSROOT/lib/libLLVM.so"
          LLVM_PREFIX="$SYSROOT" cargo +"$EBPF_NIGHTLY" install bpf-linker --version "$EBPF_LINKER_VERSION" --locked
          rm -f data/zelvik-edge-xdp-ebpf.o
          cargo xtask build-ebpf
          test -s data/zelvik-edge-xdp-ebpf.o
          echo "ZELVIK_EDGE_XDP_EBPF_SOURCE=data/zelvik-edge-xdp-ebpf.o" >> "$GITHUB_ENV"
          echo "ZELVIK_EDGE_XDP_EBPF_SHA256=$(sha256sum data/zelvik-edge-xdp-ebpf.o | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build real Edge and fake control-plane fixture
        run: |
          set -euo pipefail
          cargo build --bin Zelvik-Edge --example issue34-controller

      - name: Full-Edge fixture preflight
        run: |
          set -euo pipefail
          python3 -I scripts/memory/full_edge.py preflight \
            --edge-binary target/debug/Zelvik-Edge \
            --controller-bin target/debug/examples/issue34-controller

      - name: Dedicated full-Edge continuous soak
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/issue34-dedicated"
          mkdir -p "$OUT"
          DURATION=$(( ISSUE34_DEDICATED_HOURS * 3600 ))
          sudo systemd-run --scope \
            --property=MemoryMax=2G \
            --property=MemoryHigh=1536M \
            --property=MemorySwapMax=0 \
            --setenv=PATH=/usr/local/bin:/usr/bin:/bin \
            --setenv=ISSUE34_REQUIRE_LINUX=1 \
            --working-directory="$GITHUB_WORKSPACE" \
            -- python3 -I scripts/memory/full_edge.py soak \
              --edge-binary "$GITHUB_WORKSPACE/target/debug/Zelvik-Edge" \
              --controller-bin "$GITHUB_WORKSPACE/target/debug/examples/issue34-controller" \
              --home "$OUT/home" \
              --run-dir "$OUT/run" \
              --duration "$DURATION" \
              --out "$OUT/report.json" \
              --require-node-status \
              --telemetry-mode unavailable \
              --recovery-seconds 600 \
              --soak-arg=--warmup-seconds --soak-arg=3600 \
              --soak-arg=--min-span-seconds --soak-arg=7200 \
              --soak-arg=--sample-interval --soak-arg=5 \
              --soak-arg=--budget-mib-per-hour --soak-arg=0.5 \
              --soak-arg=--anon-budget-mib-per-hour --soak-arg=0.5 \
              --soak-arg=--split-baseline \
              --soak-arg=--max-rss-mib --soak-arg=1536 \
              --soak-arg=--pressure-cycles --soak-arg=10 \
              --soak-arg=--pressure-start-fraction --soak-arg=0.005 \
              --soak-arg=--pressure-bytes --soak-arg=1610612736 \
              --soak-arg=--pressure-hold-seconds --soak-arg=60 \
              --soak-arg=--pressure-settle-seconds --soak-arg=60 \
              --soak-arg=--pressure-recovery-probe-seconds --soak-arg=30 \
              --soak-arg=--pressure-long-recovery \
              --soak-arg=--min-requests --soak-arg=1000 \
              --soak-arg=--max-load-errors --soak-arg=10 \
            | tee "$OUT/summary.json"
          python3 -I - "$OUT/summary.json" "$OUT/report.json" <<'PY'
          import json, sys
          import os
          hours = int(os.environ["ISSUE34_DEDICATED_HOURS"])
          summary = json.load(open(sys.argv[1]))
          report = json.load(open(sys.argv[2]))
          assert summary["status"] == "pass", summary
          assert summary["soak_exit_code"] == 0, summary
          assert report["verdict"] == "pass", report["violations"]
          # Retryable telemetry closure: unavailable backend first, retained
          # batches, then a real durable receipt after recovery. The store is
          # a bounded file under $RUNNER_TEMP, not a production path and not a
          # fabricated acknowledgement.
          recovery = summary["telemetry_recovery"]
          assert recovery is not None, summary
          assert recovery["status"] == "pass", recovery
          assert recovery["mode"] == "unavailable->success", recovery
          assert recovery["pending_before"] >= 1, recovery
          assert recovery["pending_after"] == 0, recovery
          assert recovery["acked_sequence"] >= recovery["max_sequence"], recovery
          assert 0 < recovery["max_batch_bytes"] <= 8 * 1024 * 1024, recovery
          assert recovery["bounded_status"] is True, recovery
          assert summary["telemetry_mode"] == "unavailable", summary
          assert summary["telemetry_store"].startswith(os.environ["RUNNER_TEMP"] + "/"), summary
          # This is the production-startup lane, not the bench-defense
          # component surrogate.
          assert report["scope"]["full_edge"] is True, report["scope"]
          assert report["scope"]["production_startup"] is True, report["scope"]
          assert report["scope"]["component_lane"] is False, report["scope"]
          # A >=48 h claim must be backed by >=48 h of wall clock and samples;
          # a seconds-level integration run can never satisfy this.
          assert hours >= 48
          assert report["duration_seconds"] >= hours * 3600 * 0.95, report["duration_seconds"]
          # Expected samples come from the tracked active sampling window, not
          # from requested wall clock; pressure cycles block the loop.
          assert report["expected_samples"] > 0, report
          assert report["pressure_before_measurement"] is True, report["pressure"]
          assert report["pressure_end_offset_seconds"] < report["measurement_start_offset_seconds"], report["pressure"]
          assert report["measurement_stabilization_end_offset_seconds"] <= report["measurement_start_offset_seconds"], report["measurement"]
          assert report["measurement"]["stabilization_plateaued"] is True, report["measurement"]
          assert report["measurement"]["load_errors"] <= 10, report["measurement"]
          assert report["measurement_samples"] >= report["expected_samples"] * 0.9, (
              report["measurement_samples"], report["expected_samples"])
          assert report["target"]["same_pid"] is True
          assert report["node_status"]["required"] is True
          last = report["node_status"]["last"]
          assert last is not None
          # Presence and monotonicity are checked on every sample; zero is a
          # valid value when no reclaim/janitor cycle has happened yet.
          assert last["workerReclaim.generation"] >= 0
          assert last["cacheJanitor.cycles"] >= 0
          # Actual allocator-cache accounting must be present and consistent.
          assert last["metricValuesCache.estimatedBytes"] >= 0
          assert last["metricsAggregatorBytes"] >= last["metricValuesCache.estimatedBytes"]
          assert last["workerReclaim.coversAllWorkers"] is False
          gap = report["node_status"]["coverage_gap"]
          assert gap is not None, report["node_status"]
          assert gap["value"] is False
          assert gap["unhookedPingoraWorkers"] >= 1, gap
          # Strict 0.5 MiB/h budget on total RSS and anonymous RSS, plus the
          # second-half platform comparison and half-to-half step baseline.
          assert report["screen_only"] is False
          assert report["slope"]["ok"] is True, report["slope"]
          assert report["anon_slope"]["ok"] is True, report["anon_slope"]
          for name in ("slope", "anon_slope"):
              assert report[name]["upper95_mib_per_hour"] < 0.5, report[name]
              assert report[name]["theil_sen_mib_per_hour"] < 0.5, report[name]
          split = report["split_baseline"]
          assert split is not None
          for name in ("rss", "anon"):
              assert split[name]["ok"] is True, split[name]
              assert split[name]["second"]["upper95_mib_per_hour"] < 0.5, split[name]
              assert split[name]["second"]["theil_sen_mib_per_hour"] < 0.5, split[name]
              assert split[name]["step_mib"] <= split[name]["step_allowed_mib"], split[name]
          assert report["pressure"]["cycles"] == 10
          probe = report["pressure"]["result"]
          assert probe["long_recovery"] is True
          assert probe["hold_seconds"] >= 60
          assert probe["recovery_probe_seconds"] >= 30
          assert probe["recovery_probe_samples"] >= 10, probe
          print(json.dumps({
              "verdict": report["verdict"],
              "slope": report["slope"],
              "anon_slope": report["anon_slope"],
              "split_baseline": report["split_baseline"],
          }, indent=2))
          PY

      - name: Diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/issue34-dedicated"
          [ -f "$OUT/report.json" ] && cat "$OUT/report.json" || true
          [ -f "$OUT/summary.json" ] && cat "$OUT/summary.json" || true
          [ -f "$OUT/run/edge.log" ] && tail -n 120 "$OUT/run/edge.log" || true
          [ -f "$OUT/run/controller.log" ] && tail -n 120 "$OUT/run/controller.log" || true
