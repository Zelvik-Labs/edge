[package]
name = "zelvik-edge-h3-quiche"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[patch.crates-io]
# Same immutable upstream FIN-acknowledgement fix as the complete Edge node.
quiche = { git = "https://github.com/cloudflare/quiche", rev = "af8788e03413ebb3cf81123fc4f1aacea44dfc40" }
octets = { git = "https://github.com/cloudflare/quiche", rev = "af8788e03413ebb3cf81123fc4f1aacea44dfc40" }

[dependencies]
bytes = "=1.12.1"
futures-util = "=0.3.34"
h3 = "=0.0.8"
parking_lot = "=0.12.5"
tokio = { version = "=1.53.1", features = ["sync", "net", "rt-multi-thread", "macros", "time"] }
# 0.20.1 caps libc <0.2.190 for upstream iOS; Edge mace-kv needs >=0.2.191.
# Linux experiment uses 0.20.0 with the same quiche 0.30 and 0-RTT disabled.
tokio-quiche = { version = "=0.20.0", default-features = false }
# Same TLS provider as tokio-quiche, exposed for prevalidated dynamic SNI contexts.
boring = "5"

[dev-dependencies]
h3-quinn = "=0.0.10"
quinn = "=0.11.11"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
http = "=1.5.0"
