syntax = "proto3";
package pb;
option go_package = "./pb";

// A successful receipt means the configured backend has durably accepted
// the complete batch. Enqueueing in API memory is never a receipt.
service TelemetryService {
  rpc uploadBatch(TelemetryBatch) returns (TelemetryReceipt);
}

message TelemetryBatch {
  uint32 schemaVersion = 1;
  string batchId = 2;
  string bootId = 3;
  uint64 sequence = 4;
  // Fixed allowlist; payload is the corresponding existing protobuf request.
  string kind = 5;
  bytes payload = 6;
  int64 occurredAt = 7;
  string assignmentVersion = 8;
  string routeVersion = 9;
  int64 windowStart = 10;
  bool windowComplete = 11;
  bool hasGap = 12;
  string gapReason = 13;
  string gapKind = 14;
  map<int64, uint64> errorCounts = 15;
  string sourceBootId = 16;
  int64 segmentStartedAt = 17;
}

// Exact identities from short Edge microbatches. The backend unions these
// across batches, nodes and longer periods; counts are never additive.
message UniqueIpObservations {
  repeated UniqueIpObservation observations = 1;
}

message UniqueIpObservation {
  int64 serverId = 1;
  // Request-start Unix seconds floored to a 60-second window.
  int64 windowStart = 2;
  string ip = 3;
}

message TelemetryReceipt {
  string batchId = 1;
  uint64 sequence = 2;
  string backend = 3;
  int64 durableAt = 4;
}
