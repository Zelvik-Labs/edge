syntax = "proto3";

package pb;

import "models/model_metric_stat.proto";
import "models/rpc_messages.proto";

option go_package = "./pb";

service MetricStatService {
    rpc uploadMetricStats(UploadMetricStatsRequest) returns (RPCSuccess);
    rpc countMetricStats(CountMetricStatsRequest) returns (RPCCountResponse);
    rpc listMetricStats(ListMetricStatsRequest) returns (ListMetricStatsResponse);
}

message UploadMetricStatsRequest {
    int64 serverId = 1;
    string time = 2;
    int64 count = 3;
    float total = 4;
    int32 version = 5;
    int64 itemId = 6;
    repeated UploadingMetricStat metricStats = 7;
    // Retained for wire compatibility with the old incremental contract. The
    // snapshot reporter always sends an empty list; the control plane only
    // accepts revision > 0 snapshot rows.
    repeated string keepKeys = 8;
    // Cumulative snapshot revision. 0 means a legacy incremental payload and
    // is rejected with a stable retryable version-required error.
    uint64 revision = 9;
    // Actual covered event window, unix seconds. The identity remains `time`;
    // windowEnd advances only to the last real event (+1s) in the period.
    int64 windowStart = 10;
    int64 windowEnd = 11;
}

message CountMetricStatsRequest {
    int64 metricItemId = 1;
}

message ListMetricStatsRequest {
    int64 metricItemId = 1;
    int64 offset = 2;
    int64 size = 3;
}

message ListMetricStatsResponse {
    repeated MetricStat metricStats = 1;
}
