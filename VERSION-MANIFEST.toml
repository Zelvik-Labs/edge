# Product version and source provenance are deliberately separate.
# Versioning follows Zelvik CalVer YY.M.W[.P]: the week-of-month is
# ceil(day / 7), with an optional patch inside the component's release bucket.
# Cargo keeps the three-part YY.M.W base; product_version owns the full version.
product = "Zelvik-Edge"
# Single source of truth for the shipped product version, including the
# optional CalVer patch segment that Cargo cannot express. Scripts derive it
# via scripts/release-version.sh; never hand-write it anywhere else.
product_version = "26.10.5"
# Three-segment base that must equal [package].version in Cargo.toml.
cargo_version = "26.10.5"
release_tag = "v26.10.5"
version_scheme = "YY.M.W[.P]"

[upstream]
project = "cloud-node-rust"
version = "1.3.1"
commit = "b3cdc377e7e41c0c12099a6ba36dd45a8804248a"
relationship = "merged-from-upstream-main"

[protocol]
legacy_lineage = "cloud-node-rust-v1"
node_control = "legacy-compatible-v1"
config_schema = 1
event_schema = 1

# This migration is not a numeric upgrade from cloud-node-rust 1.x.
# Installers must detect the legacy lineage and record an explicit migration.
migration_required_from_upstream = true
