[build-dependencies]
tonic-prost-build = "0.14.6"

# crates/zelvik-edge-xdp-ebpf stays outside: it pins a dated nightly via its
# own rust-toolchain.toml and builds for the bpfeb target — it must not join
# this workspace's resolution.
[workspace]
members = ["crates/zelvik-edge-transport"]
# zelvik-edge-xdp-ebpf pins its own dated nightly/bpfeb toolchain;
# pingora-main is a vendored checkout with its own workspace root;
# xtask is a standalone tool manifest — all three must stay outside
# this workspace's auto-membership.
exclude = ["crates/zelvik-edge-xdp-ebpf", "pingora-main", "xtask"]

# smoltcp-edge is a controlled fork of smoltcp 0.14.0 (T3): transport
# hooks in socket/tcp.rs + minimal wire repr surface, every divergence
# recorded in vendor/smoltcp-edge/DIVERGENCE.md. This patch redirects
# both dependency declarations (linux target + dev-dependencies).
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp-edge" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
