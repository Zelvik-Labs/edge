[package]
name = "zelvik-edge"
version = "26.10.2"
edition = "2024"
rust-version = "1.99.0"
description = "Zelvik Edge CDN and global traffic data plane"

[package.metadata.zelvik]
product = "Zelvik-Edge"
version_scheme = "product-semver"
upstream_project = "cloud-node-rust"
upstream_version = "1.2.2"
upstream_commit = "631e5c76cc5605e748dc0230ffc019053b852f80"
compatibility_lineage = "cloud-node-rust-v1"

[features]
default = ["node-control"]
# Prefer signed NodeControl full snapshots and structured health. Legacy
# configuration RPCs remain compatible with APIs returning Unimplemented.
node-control = []

[[bin]]
name = "Zelvik-Edge"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
async-stream = "0.3.6"
aws-lc-rs = "1.18.0"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
cfb-mode = "0.9.1"
dashmap = "6.1.0"
clap = { version = "4.6.6", features = ["derive"] }
http = "1.5.0"
hmac = "0.13.0"
h2 = "0.4.16"
h3 = "0.0.8"
h3-quinn = "0.0.10"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ipnet = "2.12.1"
md-5 = "0.11.0"
pingora = { version = "=0.9.0", path = "./pingora-main/pingora", features = ["proxy", "cache", "rustls"] }
pingora-core = { version = "=0.9.0", path = "./pingora-main/pingora-core", features = ["rustls"] }
pingora-load-balancing = { version = "=0.9.0", path = "./pingora-main/pingora-load-balancing", features = ["rustls"] }
pingora-proxy = { version = "=0.9.0", path = "./pingora-main/pingora-proxy", features = ["rustls"] }
pingora-http = { version = "=0.9.0", path = "./pingora-main/pingora-http" }
pingora-cache = { version = "=0.9.0", path = "./pingora-main/pingora-cache", features = ["rustls"] }
pingora-memory-cache = { version = "=0.9.0", path = "./pingora-main/pingora-memory-cache" }
bloom = "0.3.2"
prost = "0.14.4"
regex = "1.13.1"
aho-corasick = "1.1.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
quinn = "0.11.11"
# Direct pin to the lockfile version so `congestion::Controller` impls
# can name `RttEstimator` (quinn does not re-export it).
quinn-proto = "=0.11.17"
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6.5"
flate2 = "1.1.9"
futures-util = "0.3.34"
md5_legacy = { package = "md5", version = "0.8.1" }
brotli = "8.0.4"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["gzip", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Shared control-channel suite (L1-L6): zvc1 credentials, the zelvik-* metadata
# interceptor, the nine-step server pipeline and the cursor rules.
zelvik-suite = { path = "../protocol/suite/rust" }
urlencoding = "2.1.3"
uuid = { version = "1.24.1", features = ["v4"] }
webp = "0.3.1"
sysinfo = "0.39.6"
hostname = "0.4.2"
x509-parser = "0.18.1"
num_cpus = "1.17.0"
local-ip-address = "0.6.13"
governor = "0.10.4"
maxminddb = { version = "0.30.0", features = ["mmap"] }
lru = "0.18.2"
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
zstd = "0.13.3"
chrono = "0.4.45"
hex = "0.4.3"
woothee = "0.13.0"
mace-kv = "0.1.1"
rand = "0.10.2"
libinjectionrs = { path = "vendor/libinjectionrs" }
libc = "0.2.189"
parking_lot = "0.12.5"
aes-gcm = "0.11.0"
async-compression = { version = "0.4.43", features = ["tokio", "zstd"] }
arc-swap = "1.9.2"
ahash = "0.8.12"
zelvik-edge-xdp-common = { path = "crates/zelvik-edge-xdp-common", features = ["aya"] }
zelvik-edge-transport = { path = "crates/zelvik-edge-transport" }
mimalloc = "0.1.52"
# Pinned to the exact version mimalloc links so `mi_collect` resolves to the
# same statically linked allocator instance instead of a second copy.
# `extended` exposes mi_collect/mi_option_set; feature unification merges it
# into the single libmimalloc-sys build shared with the `mimalloc` crate.
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }
memmap2 = "0.9.11"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"
neli = "0.7.4"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "async", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "socket-udp"] }
xsk-rs = "0.9.0"
# Feature-unification pin: use_cc_build compiles libxdp via the cc crate
# instead of xdp-tools' configure/make, which is what makes cross-compiling
# from non-Linux hosts viable (still honors CLANG/LD/OBJCOPY env vars).
libxdp-sys = { version = "0.2.4", features = ["use_cc_build"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "async", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "socket-udp"] }

