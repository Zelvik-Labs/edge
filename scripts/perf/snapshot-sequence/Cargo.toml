[package]
name = "snapshot-sequence-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
model = ["dep:loom"]

[dependencies]
loom = { version = "=0.7.2", optional = true }

[[bin]]
name = "snapshot-sequence-probe"
path = "../../../benches/support/snapshot_sequence_probe.rs"

[[bin]]
name = "snapshot-sequence-model"
path = "../../../benches/support/snapshot_sequence_model.rs"
required-features = ["model"]

[profile.release]
lto = "fat"
codegen-units = 1
