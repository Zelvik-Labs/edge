[package]
name = "edge-afxdp-wake-bench"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Deliberately independent: native probe dependencies are not required by
# ordinary Edge builds or by non-Linux targets.
[workspace]

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.191"
serde_json = "=1.0.154"
tokio = { version = "=1.53.1", features = ["full"] }
tracing = "=0.1.44"

[build-dependencies]
cc = "=1.4.3"
pkg-config = "=0.3.34"

[[bench]]
name = "wake"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
