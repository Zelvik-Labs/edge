# Edge secret (reference only). The cluster is expected to provide the real
# Secret with these keys (via External Secrets + Vault/KMS in production, or a
# plain Secret created by the operator in single-node v1). Never commit values.
# To pre-create:
#   kubectl -n cloudsidra-edge create secret generic cloudsidra-edge-secret \
#     --from-literal=internal-token=CHANGE_ME \
#     --from-file=api_node.yaml=./api_node.yaml
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudsidra-edge.fullname" . }}-secret
  labels:
    {{- include "cloudsidra-edge.labels" . | nindent 4 }}
type: Opaque
stringData:
  internal-token: "CHANGE_ME_TO_A_LONG_RANDOM_TOKEN"
{{- end }}
