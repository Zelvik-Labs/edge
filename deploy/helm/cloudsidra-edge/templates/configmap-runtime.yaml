apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudsidra-edge.fullname" . }}-runtime
  labels:
    {{- include "cloudsidra-edge.labels" . | nindent 4 }}
data:
  runtime.yaml: |
    runtime:
      mode: {{ .Values.runtime.mode }}
    cluster:
      enabled: {{ if eq .Values.runtime.mode "rke2" -}} true {{- else -}} false {{- end }}
      type: {{ .Values.cluster.type }}
      name: {{ .Values.cluster.name }}
      namespace: {{ .Values.cluster.namespace }}
      serviceName: {{ include "cloudsidra-edge.fullname" . }}-internal
      podNameEnv: POD_NAME
      podIpEnv: POD_IP
      internalApi:
        bind: 0.0.0.0:19090
        tokenEnv: CLOUD_NODE_CLUSTER_INTERNAL_TOKEN
      leaderElection:
        leaseName: cloudsidra-edge-leader
        leaseDurationSeconds: 15
        renewDeadlineSeconds: 10
        retryPeriodSeconds: 2
      cache:
        localMetaDir: {{ .Values.storage.cache.localMetaDir }}
        maxFastL1Bytes: {{ .Values.storage.cache.maxFastL1Bytes }}
        sharedMaxBytes: {{ .Values.storage.cache.sharedMaxBytes }}
        minFreeBytes: {{ .Values.storage.cache.minFreeBytes }}
        ignoreControlPlaneStorageOptions: {{ .Values.storage.cache.ignoreControlPlaneStorageOptions }}
        shardStrategy: {{ .Values.storage.cache.shardStrategy }}
        shards:
          {{- range .Values.storage.cache.shards }}
          - id: {{ .id }}
            path: {{ .path }}
            weight: {{ .weight }}
            replicas: {{ .replicas }}
          {{- end }}
    xdp:
      enabled: {{ .Values.xdp.enabled }}
