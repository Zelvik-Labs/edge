{{- range .Values.storage.cache.shards }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cloudsidra-edge.fullname" $ }}-cache-{{ .id }}
  labels:
    {{- include "cloudsidra-edge.labels" $ | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $.Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size | default "100Gi" }}
---
{{- end }}
