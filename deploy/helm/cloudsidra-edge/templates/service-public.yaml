apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudsidra-edge.fullname" . }}-public
  labels:
    {{- include "cloudsidra-edge.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  selector:
    {{- include "cloudsidra-edge.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol }}
      {{- if (index $.Values.service.nodePort .name) }}
      nodePort: {{ index $.Values.service.nodePort .name | quote }}
      {{- end }}
    {{- end }}
