{{- if .Values.internalService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudsidra-edge.fullname" . }}-internal
  labels:
    {{- include "cloudsidra-edge.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "cloudsidra-edge.selectorLabels" . | nindent 4 }}
  ports:
    - name: internal
      port: {{ .Values.internalService.port }}
      targetPort: internal
      protocol: TCP
{{- end }}
