# Edge production hardening profile. Deploy on dedicated data-plane nodes.
# DaemonSet per-node cache; Vault/KMS-backed Secret; no placeholder Secret.
image:
  tag: "2026.1.08.0"
  pullPolicy: IfNotPresent

workload:
  daemonSet: true
  replicas: 1  # ignored for DaemonSet

runtime:
  mode: rke2

cluster:
  type: rke2

# Production Secret via External Secrets + Vault/KMS; chart only references.
secret:
  create: false

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "8"
    memory: 16Gi
