# RKE2 profile. longhorn storage class, kube-vip/MetalLB LoadBalancer,
# ingress can use the built-in LB provider. All differences live here so the
# business chart templates stay provider-neutral.
cluster:
  type: rke2
  namespace: cloudsidra-edge

storage:
  storageClass: longhorn

service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    # Example MetalLB advertising annotation. Adjust to your LB.
    metallb.universe.tf/loadBalancerIPs: ""
